name: Quality Gate

# Runs the full quality gate (`just check-full`, i.e. `python3 -m
# outcomeeng.validation check-full` — validation and test primitive recipes)
# on every path to `main`, so a deterministic-
# verification failure cannot reach `main` unseen. Governed by
# spx/13-infrastructure.enabler/21-test-infrastructure.enabler/15-ci-gate.adr.md.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read
  actions: read # gh run list/view in the [test]-lane l3 workflow-observability tests

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Pinned tool versions; Renovate advances these via the customManager
      # regex in renovate.json (each line carries a `# renovate:` annotation).
      UV_VERSION: "0.11.17" # renovate: datasource=github-releases depName=astral-sh/uv
      JUST_VERSION: "1.53.0" # renovate: datasource=github-releases depName=casey/just
      CLAUDE_CLI_VERSION: "2.1.168" # renovate: datasource=npm depName=@anthropic-ai/claude-code
      CODEX_CLI_VERSION: "0.145.0" # renovate: datasource=npm depName=@openai/codex
      DPRINT_VERSION: "0.55.2" # renovate: datasource=npm depName=dprint
      SPX_VERSION: "0.6.15" # renovate: datasource=npm depName=@outcomeeng/spx
      ACTIONLINT_VERSION: "1.7.12" # renovate: datasource=github-releases depName=rhysd/actionlint
      SHELLCHECK_VERSION: "0.11.0" # renovate: datasource=github-releases depName=koalaman/shellcheck
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install Bun
        # Bun provisions the gate's external npm CLIs by running each package's
        # postinstall, which fetches platform-native binaries where required.
        # pnpm blocks those postinstall scripts.
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # bun v1.3.14
        with:
          bun-version: "1.3.14"

      - name: Install gate CLIs (just, actionlint, shellcheck)
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            -o just.tar.gz
          tar -xzf just.tar.gz just
          sudo install -m 0755 just /usr/local/bin/just

          curl -fsSL \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            -o actionlint.tar.gz
          tar -xzf actionlint.tar.gz actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint

          curl -fsSL \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            -o shellcheck.tar.xz
          tar -xJf shellcheck.tar.xz
          sudo install -m 0755 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck

          just --version
          actionlint -version
          shellcheck --version

      - name: Install gate CLIs (claude, codex, dprint, spx)
        run: |
          set -euo pipefail
          # bun add -g installs into $BUN_INSTALL/bin, which setup-bun puts on
          # PATH; echo it to GITHUB_PATH so the gate steps find each binary.
          # claude -> manifests and installation tests; codex -> installation tests;
          # dprint -> fmt-check step; spx -> markdown step.
          bun add -g \
            "@anthropic-ai/claude-code@${CLAUDE_CLI_VERSION}" \
            "@openai/codex@${CODEX_CLI_VERSION}" \
            "dprint@${DPRINT_VERSION}" \
            "@outcomeeng/spx@${SPX_VERSION}"
          echo "${BUN_INSTALL:-$HOME/.bun}/bin" >> "$GITHUB_PATH"
          export PATH="${BUN_INSTALL:-$HOME/.bun}/bin:$PATH"
          claude --version
          codex --version
          dprint --version
          spx --version

      - name: Run quality gate
        # GH_TOKEN authenticates the gh CLI for the [test]-lane l3
        # workflow-observability tests (the only l3 tests in the tree); without
        # it `gh auth status` fails and those tests fail loudly by design.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: just check-full
