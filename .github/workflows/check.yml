name: Quality Gate

# Runs the full quality gate (`just check`, i.e. `uv run python -m
# outcomeeng.validation` — every step in outcomeeng.validation.STEPS) on every
# path to `main`, so a deterministic-verification failure cannot reach `main`
# unseen. Governed by
# spx/13-infrastructure.enabler/21-test-infrastructure.enabler/15-ci-gate.adr.md.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Pinned tool versions; Renovate advances these via the customManager
      # regex in renovate.json (each line carries a `# renovate:` annotation).
      UV_VERSION: "0.11.17" # renovate: datasource=github-releases depName=astral-sh/uv
      CLAUDE_CLI_VERSION: "2.1.168" # renovate: datasource=npm depName=@anthropic-ai/claude-code
      DPRINT_VERSION: "0.54.0" # renovate: datasource=npm depName=dprint
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install Bun
        # Bun provisions the gate's two external CLIs (the Claude Code CLI for
        # the `manifests` step's `claude plugin validate`, and dprint for the
        # `fmt-check` step) by running each npm package's postinstall, which
        # fetches the platform-native binary. pnpm blocks that postinstall.
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # bun v1.3.14
        with:
          bun-version: "1.3.14"

      - name: Install gate CLIs (claude, dprint)
        run: |
          set -euo pipefail
          # bun add -g installs into $BUN_INSTALL/bin, which setup-bun puts on
          # PATH; echo it to GITHUB_PATH so the gate step finds both binaries.
          bun add -g \
            "@anthropic-ai/claude-code@${CLAUDE_CLI_VERSION}" \
            "dprint@${DPRINT_VERSION}"
          echo "${BUN_INSTALL:-$HOME/.bun}/bin" >> "$GITHUB_PATH"
          export PATH="${BUN_INSTALL:-$HOME/.bun}/bin:$PATH"
          claude --version
          dprint --version

      - name: Run quality gate
        run: uv run python -m outcomeeng.validation
