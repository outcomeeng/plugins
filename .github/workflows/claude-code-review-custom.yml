# Reusable Claude Code Review workflow for automatic PR reviews
#
# Usage in caller workflow:
#
#   on:
#     pull_request:
#       types: [opened, synchronize]
#
#   jobs:
#     review:
#       uses: outcomeeng/gh-actions/.github/workflows/claude-code-review.yml@main
#       secrets:
#         CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
#
# Optional inputs cover model selection, full claude_args passthrough,
# custom trigger phrase, Bedrock/Vertex routing, and a runner override.

name: Claude Code Review

on:
  workflow_call:
    inputs:
      runner:
        description: |
          Runner selection for all three jobs. Accepts either:
          - A single label: 'ubuntu-slim', 'ubuntu-latest', 'self-hosted'
          - A JSON array of labels: '["self-hosted","laptop"]'
          The wrapper detects which form was passed and dispatches correctly.
          Security: self-hosted runners must not be used from public repos or repos that accept PRs from untrusted forks. The reusable-workflow validate-workflow gate restricts what untrusted PRs can change, but the runner host itself is shared across runs. Only set a self-hosted runner here when every PR contributor is trusted (typical for private org repos).
        type: string
        default: ubuntu-slim
      concurrency_cancel:
        description: "Cancel in-progress reviews when PR is updated."
        type: boolean
        default: false
      custom_prompt:
        description: "Custom review prompt (replaces the default review prompt)."
        type: string
        default: ""
      model:
        description: "Claude model to use, e.g. claude-opus-4-7. Folded into claude_args as --model. Empty means use the action's default."
        type: string
        default: ""
      claude_args:
        description: |
          Extra CLI arguments for Claude Code OTHER than --allowed-tools.
          For tool restrictions, use append_allow_list / override_allow_list.
          Examples: '--max-turns 20', '--debug', '--mcp-config /path/to/cfg'.
        type: string
        default: ""
      append_allow_list:
        description: |
          Comma-separated tool patterns appended to the wrapper's baseline
          allowlist (Bash(gh ...) for reading PR context and posting the
          review comment). Use Claude Code's --allowed-tools pattern syntax.
          Example: 'Bash(make test:*),Bash(yarn lint:*)'
          Ignored when override_allow_list is set.
        type: string
        default: ""
      override_allow_list:
        description: |
          Comma-separated tool patterns that replace the wrapper's baseline
          allowlist entirely. Use Claude Code's --allowed-tools pattern syntax.
          Example: 'Bash(gh pr view:*),Bash(gh pr comment:*)'
          Use when you need a strictly narrower (or different) allowlist than
          the bake-in.
        type: string
        default: ""
      trigger_phrase:
        description: "Trigger phrase for @-mention activation. Defaults to @claude."
        type: string
        default: "@claude"
      use_bedrock:
        description: "Route Claude through Amazon Bedrock instead of the Claude API. Caller is responsible for AWS auth (e.g. via aws-actions/configure-aws-credentials in a wrapping workflow) and for setting AWS_REGION via additional_env."
        type: boolean
        default: false
      use_vertex:
        description: "Route Claude through Google Vertex AI instead of the Claude API. Caller is responsible for GCP auth (e.g. via google-github-actions/auth) and for setting ANTHROPIC_VERTEX_PROJECT_ID / CLOUD_ML_REGION / VERTEX_REGION_* via additional_env."
        type: boolean
        default: false
      additional_env:
        description: "JSON object string of env vars to set on the claude-code-action step. Used to pass cloud-provider config (AWS_REGION, ANTHROPIC_VERTEX_PROJECT_ID, etc.) without changing the action invocation."
        type: string
        default: "{}"
      use_project_plugins:
        description: |
          When true, read `.claude/settings.json` from the caller repository and install the plugins it declares under `enabledPlugins` plus the marketplaces under `extraKnownMarketplaces`. Default false so the review job runs with no project plugins — many plugins ship skills with "ALWAYS invoke before X" mandates that pull Claude into tools (Read, Grep, Glob, git) outside the wrapper's allowlist, burning turns on permission denials before any review comment is posted. Set true only when the project plugins are review-appropriate and the allowlist is widened to match (via append_allow_list / override_allow_list).
        type: boolean
        default: false
      plugin_marketplaces:
        description: "Space-separated list of marketplaces to register (`owner/repo`, ref ignored — pin via the marketplace repo). Appends to the project's `extraKnownMarketplaces` when use_project_plugins is true; sole source when false."
        type: string
        default: ""
      extra_plugins:
        description: "Space-separated list of plugins to install. Appends to the project's `enabledPlugins` when use_project_plugins is true; sole source when false."
        type: string
        default: ""
      show_full_output:
        description: |
          Stream the full per-turn JSON output from Claude Code to the job log instead of the default redacted summary. Useful when the review run takes longer than expected and you want visibility into what Claude is doing turn-by-turn. WARNING (per the upstream action): the full output includes ALL tool execution results, which may contain secrets, API keys, or other sensitive material from the repo. GitHub Actions job logs are visible to anyone with read access to the repository (and to the public for public repos). Only enable when debugging in a non-sensitive context.
        type: boolean
        default: false
      timeout_minutes:
        description: |
          Wall-clock budget for the Run Claude Code Review step. When exceeded, GitHub cancels the step with a clear timeout message; the post-action cleanup steps (token revocation, buffered inline comments, workspace cleanup) still run, so the runner is left in a clean state. Default 15 covers a typical review with headroom. Lower it (e.g. to 5) to fail fast when a run hangs, or raise it for repositories where reviews legitimately take longer. Minimum meaningful value is 1; GitHub Actions silently rejects `timeout-minutes: 0` at runtime. Applies only to the Claude Code Action step; the authorize and validate-workflow jobs are short-lived and not gated by this input.
        type: number
        default: 15
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: "Claude Code OAuth token. Not required when use_bedrock or use_vertex is true (cloud credentials provide auth in those cases)."
        required: false

jobs:
  authorize:
    runs-on: ${{ startsWith(inputs.runner, '[') && fromJSON(inputs.runner) || inputs.runner }}
    permissions:
      contents: read
    outputs:
      authorized: ${{ steps.check.outputs.authorized }}
    steps:
      - name: Check PR author permission
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ -z "$PR_AUTHOR" ]]; then
            echo "::notice::No PR author in the event payload; skipping review"
            echo "authorized=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          perm=$(gh api "repos/$REPO/collaborators/$PR_AUTHOR/permission" --jq '.permission' 2>/dev/null || echo "none")
          case "$perm" in
            admin|maintain|write)
              echo "PR author '$PR_AUTHOR' has '$perm' permission on $REPO — review authorized"
              echo "authorized=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::notice::PR author '$PR_AUTHOR' has '$perm' permission on $REPO; skipping review (review requires admin, maintain, or write)"
              echo "authorized=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

  validate-workflow:
    runs-on: ${{ startsWith(inputs.runner, '[') && fromJSON(inputs.runner) || inputs.runner }}
    permissions:
      contents: read
    outputs:
      matches: ${{ steps.check.outputs.matches }}
    steps:
      - name: Compare caller workflow file to default branch
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # github.workflow_ref is "<owner>/<repo>/<path>@<ref>".
          prefix="$REPO/"
          path="${WORKFLOW_REF#$prefix}"
          path="${path%@*}"
          echo "Caller workflow file: $path"

          default_branch=$(gh api "repos/$REPO" --jq '.default_branch')
          head_sha_blob=$(gh api "repos/$REPO/contents/$path?ref=$HEAD_SHA" --jq '.sha' 2>/dev/null || echo "")
          default_sha_blob=$(gh api "repos/$REPO/contents/$path?ref=$default_branch" --jq '.sha' 2>/dev/null || echo "")

          if [[ -z "$default_sha_blob" ]]; then
            echo "::notice::Workflow file '$path' is not on $default_branch yet. The Anthropic action requires the caller workflow file to exist on the default branch with identical content. Merge this PR (or a workflow-only PR that lands the file first) into $default_branch, then subsequent PRs will be reviewed automatically."
            echo "matches=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "$head_sha_blob" ]]; then
            echo "::notice::Workflow file '$path' is not present at the PR head; nothing to review here."
            echo "matches=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$head_sha_blob" != "$default_sha_blob" ]]; then
            echo "::notice::Workflow file '$path' at PR head differs from $default_branch. The Anthropic action requires identical content for security. Land the workflow change on $default_branch first (a workflow-only PR is the typical approach), then this PR will be reviewed automatically."
            echo "matches=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Workflow file at PR head matches $default_branch — review can proceed"
          echo "matches=true" >> "$GITHUB_OUTPUT"

  claude-review:
    needs: [authorize, validate-workflow]
    if: needs.authorize.outputs.authorized == 'true' && needs.validate-workflow.outputs.matches == 'true'
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: ${{ inputs.concurrency_cancel }}
    runs-on: ${{ startsWith(inputs.runner, '[') && fromJSON(inputs.runner) || inputs.runner }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Derive plugin and marketplace inputs
        id: plugins
        shell: bash
        env:
          PLUGIN_MARKETPLACES: ${{ inputs.plugin_marketplaces }}
          EXTRA_PLUGINS: ${{ inputs.extra_plugins }}
          USE_PROJECT_PLUGINS: ${{ inputs.use_project_plugins }}
        run: |
          set -euo pipefail
          plugins=""
          marketplaces=""

          if [[ "$USE_PROJECT_PLUGINS" == "true" ]]; then
            if [[ -f .claude/settings.json ]]; then
              jq empty .claude/settings.json
              plugins=$(jq -r '.enabledPlugins // {} | to_entries[] | select(.value == true) | .key' .claude/settings.json)
              marketplaces=$(jq -r '
                .extraKnownMarketplaces // {} | to_entries[]
                | select(.value.source.source == "github")
                | "https://github.com/" + .value.source.repo + ".git"
              ' .claude/settings.json)
            fi
          elif [[ -f .claude/settings.json ]]; then
            echo "::notice::.claude/settings.json found but use_project_plugins is false; its enabledPlugins and extraKnownMarketplaces are ignored. Set use_project_plugins: true to opt in, or list specific plugins via extra_plugins and marketplaces via plugin_marketplaces."
          fi

          for p in $EXTRA_PLUGINS; do
            [[ -z "$p" ]] && continue
            plugins=$(printf '%s\n%s' "$plugins" "$p")
          done

          for m in $PLUGIN_MARKETPLACES; do
            [[ -z "$m" ]] && continue
            repo=${m%@*}
            marketplaces=$(printf '%s\n%s' "$marketplaces" "https://github.com/${repo}.git")
          done

          plugins=$(echo "$plugins" | sed '/^$/d')
          marketplaces=$(echo "$marketplaces" | sed '/^$/d')

          delim="MULTILINE_$(cat /proc/sys/kernel/random/uuid)"
          {
            echo "plugins<<${delim}"
            echo "$plugins"
            echo "${delim}"
            echo "marketplaces<<${delim}"
            echo "$marketplaces"
            echo "${delim}"
          } >> "$GITHUB_OUTPUT"

          echo "::group::Derived plugin install inputs"
          echo "plugins:"
          echo "$plugins"
          echo "marketplaces:"
          echo "$marketplaces"
          echo "::endgroup::"

      - name: Compose claude_args
        id: claude-args
        env:
          MODEL: ${{ inputs.model }}
          EXTRA_ARGS: ${{ inputs.claude_args }}
          APPEND_ALLOW_LIST: ${{ inputs.append_allow_list }}
          OVERRIDE_ALLOW_LIST: ${{ inputs.override_allow_list }}
        run: |
          set -euo pipefail
          # Trim leading/trailing whitespace so a caller passing " " (or a
          # YAML block with trailing newline) doesn't append a stray empty
          # pattern that Claude Code would silently drop or reject.
          trim() { local s=${1#"${1%%[![:space:]]*}"}; printf '%s' "${s%"${s##*[![:space:]]}"}"; }
          OVERRIDE_ALLOW_LIST=$(trim "$OVERRIDE_ALLOW_LIST")
          APPEND_ALLOW_LIST=$(trim "$APPEND_ALLOW_LIST")
          baseline='Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)'
          if [[ -n "$OVERRIDE_ALLOW_LIST" ]]; then
            allowlist="$OVERRIDE_ALLOW_LIST"
            if [[ -n "$APPEND_ALLOW_LIST" ]]; then
              echo "::warning::append_allow_list is ignored because override_allow_list is set."
            fi
          elif [[ -n "$APPEND_ALLOW_LIST" ]]; then
            allowlist="$baseline,$APPEND_ALLOW_LIST"
          else
            allowlist="$baseline"
          fi
          args="--allowed-tools \"$allowlist\""
          if [[ -n "$MODEL" ]]; then
            args="$args --model $MODEL"
          fi
          if [[ -n "$EXTRA_ARGS" ]]; then
            # Help callers spot the design mismatch — they should be using
            # append_allow_list / override_allow_list for tool restrictions.
            if [[ "$EXTRA_ARGS" == *--allowed-tools* || "$EXTRA_ARGS" == *--allowedTools* ]]; then
              echo "::warning::claude_args contains --allowed-tools; this will merge additively with the wrapper's allowlist (the action treats repeated flags as a Set). To narrow the allowlist, use override_allow_list; to extend, use append_allow_list."
            fi
            args="$args $EXTRA_ARGS"
          fi
          delim="ARGS_$(cat /proc/sys/kernel/random/uuid)"
          {
            printf '%s<<%s\n' "args" "$delim"
            printf '%s\n' "$args"
            printf '%s\n' "$delim"
          } >> "$GITHUB_OUTPUT"
          echo "::group::Composed claude_args"
          printf '%s\n' "$args"
          echo "::endgroup::"

      - name: Apply additional env
        env:
          ADDITIONAL_ENV: ${{ inputs.additional_env }}
        run: |
          set -euo pipefail
          if [[ -z "$ADDITIONAL_ENV" || "$ADDITIONAL_ENV" == "{}" ]]; then
            echo "No additional env to apply"
            exit 0
          fi
          # Validate JSON object before exporting; reject non-objects.
          echo "$ADDITIONAL_ENV" | jq -e 'type == "object"' >/dev/null
          # Emit each key as a heredoc-delimited GITHUB_ENV record so multiline
          # values (JSON, cert material, etc.) survive unmangled. Reject keys
          # that aren't valid POSIX env var names so a malformed input can't
          # silently inject garbage.
          while IFS= read -r entry; do
            key=$(printf '%s' "$entry" | jq -r '.key')
            if ! [[ "$key" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
              echo "::error::additional_env key '$key' is not a valid env var name"
              exit 1
            fi
            value=$(printf '%s' "$entry" | jq -r '.value | tostring')
            delim="ENV_$(cat /proc/sys/kernel/random/uuid)"
            {
              printf '%s<<%s\n' "$key" "$delim"
              printf '%s\n' "$value"
              printf '%s\n' "$delim"
            } >> "$GITHUB_ENV"
          done < <(echo "$ADDITIONAL_ENV" | jq -c 'to_entries[]')
          echo "::group::Applied additional env keys"
          echo "$ADDITIONAL_ENV" | jq -r 'keys[]'
          echo "::endgroup::"

      - name: Set review prompt
        id: set-prompt
        run: |
          if [ -n "${{ inputs.custom_prompt }}" ]; then
            delimiter="CLAUDE_PROMPT_$(cat /proc/sys/kernel/random/uuid)"
            {
              echo "prompt<<$delimiter"
              echo "${{ inputs.custom_prompt }}"
              echo "$delimiter"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "prompt<<EOF"
              cat <<'PROMPT_EOF'
          REPO: ${{ github.repository }}
          PR NUMBER: ${{ github.event.pull_request.number }}

          Review this pull request and post one comment with the review. Follow the steps in order. The environment constraints in the "Environment" section below are real — every constraint listed there cost a previous run between 5 and 20 wasted tool calls.

          ## Steps

          1. **Load repository conventions.** Read `REVIEW.md` and `CLAUDE.md` from the repository root if present. Resolve the finding-classification taxonomy and comment shape in this order: (a) `REVIEW.md` if present, (b) a taxonomy defined in `CLAUDE.md` if `REVIEW.md` is absent, (c) the defaults in the "Review shape" section below if neither file specifies one. Always read `CLAUDE.md` for project conventions independent of where the taxonomy comes from.

          2. **Gather PR context.** Run:

             ```bash
             gh pr view ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --json number,title,body,author,baseRefName,headRefName,additions,deletions,changedFiles
             gh pr diff ${{ github.event.pull_request.number }} --repo ${{ github.repository }} | sed -n '1,1000p'
             ```

             For longer diffs, keep using the same `sed` form for every chunk — `| sed -n '1001,2000p'`, `| sed -n '2001,3000p'`, and so on. To list affected files first, pipe to `| grep '^diff --git'`; to read around one file, pipe to `| sed -n '/^diff --git a\/path\/to\/file/,/^diff --git /p'`. Use the same `sed -n 'A,Bp'` form when reading any file in the working tree by line range — one process per call, same idiom for any chunk position.

          3. **Compose the review in memory.** Do not write the body to a file. Do not call the `Write` tool. Do not redirect Bash output to disk.

          4. **Post the review with one command, using `printf` and stdin:**

             ```bash
             printf '%s\n' \
               '## Code Review — PR #${{ github.event.pull_request.number }}: <PR title>' \
               '' \
               '**Summary.** <one or two sentences>' \
               '' \
               'BLOCKING [correctness]: path/to/file.py:42' \
               'Evidence: <quote the diff and explain the failure mode>.' \
               'Required before merge: <concrete change>.' \
               '' \
               '## Findings out of scope for merge' \
               '' \
               'FOLLOW-UP [test-evidence]: path/to/test.py' \
               'Evidence: <what is missing>.' \
               'Track under: <issues file or tracker>.' \
               | gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body-file /dev/stdin
             ```

             Quoting rule: wrap literal text in single quotes so `$`, backticks, and backslashes pass through unchanged. Each argument to `printf '%s\n'` is one line of output. Blank lines are `''`.

          5. **If you need to revise the comment you just posted,** use `--edit-last`:

             ```bash
             printf '%s\n' '<revised content>' \
               | gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --edit-last --body-file /dev/stdin
             ```

          ## Environment

          The runner sandboxes filesystem writes. The forms below have all been observed to fail in this workflow — skip the rediscovery and use the form in step 4 directly.

          | Do not use | Why |
          | --- | --- |
          | `Write` tool | Blocked by filesystem allowlist; every attempt errors. |
          | `> file`, `tee file`, `cat > file <<EOF` | Same filesystem allowlist applies to Bash redirection outside the repo working tree. |
          | `gh pr comment --body "$(cat <<'EOF' … EOF)"` | Command substitution with embedded heredoc is brittle here and silently truncates on some bodies. |
          | `gh pr comment --body-file /dev/stdin <<HEREDOC` | Heredoc directly to `gh` does not reliably reach the body-file reader. |
          | `gh api repos/<o>/<r>/issues/comments/<id> -X PATCH` | The Actions integration token lacks permission. Use `gh pr comment --edit-last` instead. |
          | `gh pr view <N> --repo <O/R>` without `--json` | Default view fetches `statusCheckRollup`, which the token cannot access. Always pass `--json`, and never request the `statusCheckRollup` field. Safe fields: `number,title,body,author,baseRefName,headRefName,additions,deletions,changedFiles`. |
          | Helper scripts written to disk to assemble the body | Same write blockage; also adds turns for nothing the `printf` form does not already do. |

          ## Review shape

          Cover, in this order: correctness, project conventions (from `CLAUDE.md`), potential bugs, performance, security, test coverage.

          Classify every finding by required receiver action. When `REVIEW.md` is present, it overrides this default taxonomy.

          | Class | Receiver action | Use when |
          | --- | --- | --- |
          | `BLOCKING` | Fix in this PR before merge. | Correctness bug, security risk, data-loss risk, broken required validation, policy violation. |
          | `NEEDS-ANSWER` | Answer before merge. | A required fact is missing and the answer can clear the concern or upgrade it to `BLOCKING`. |
          | `FOLLOW-UP` | Track outside this PR. | Valid concern, but fixing it would widen the PR or does not affect merge safety. |
          | `NOTE` | No action expected. | Context, praise, or observation that does not create work. Omit when it adds noise. |

          Do not use `P0`/`P1`/`P2`/`P3` or `critical`/`high`/`medium`/`low`/`minor`/`nit` as finding headings.

          Finding shape:

          ```text
          BLOCKING [correctness]: path/to/file.py:42
          Evidence: <quote the diff or behavior and explain the failure mode>.
          Required before merge: <concrete change>.
          ```

          ```text
          FOLLOW-UP [test-evidence]: path/to/test.py
          Evidence: <what is missing>.
          Track under: <issues file or tracker>.
          ```

          If the diff has no `BLOCKING` or `NEEDS-ANSWER` findings, say so directly in the comment. Do not invent lower-priority findings to prove the review happened.
          PROMPT_EOF
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Run Claude Code Review
        id: claude-review
        timeout-minutes: ${{ inputs.timeout_minutes }}
        uses: anthropics/claude-code-action@51ea8ea73a139f2a74ff649e3092c25a904aed7e # v1.0.123
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.set-prompt.outputs.prompt }}
          claude_args: ${{ steps.claude-args.outputs.args }}
          trigger_phrase: ${{ inputs.trigger_phrase }}
          use_bedrock: ${{ inputs.use_bedrock }}
          use_vertex: ${{ inputs.use_vertex }}
          plugins: ${{ steps.plugins.outputs.plugins }}
          plugin_marketplaces: ${{ steps.plugins.outputs.marketplaces }}
          show_full_output: ${{ inputs.show_full_output }}
