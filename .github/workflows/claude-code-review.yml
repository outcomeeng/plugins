# Self-contained Claude Code Review for this repository.
#
# Triggers on every PR and invokes the vendored reusable workflow at
# `./_claude-review-reusable.yml`. The reusable carries the authorize +
# validate-workflow gates and the Anthropic action invocation; this caller
# supplies the `pull_request` trigger and any repo-specific inputs.
#
# Pair with `claude-code-review-custom.yml` for an alternate review using a
# marketplace-specific prompt that follows `REVIEW.md`.

name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write
  # Required by the reusable workflow's OIDC exchange for the OAuth token.
  id-token: write

jobs:
  review:
    uses: ./.github/workflows/_claude-review-reusable.yml
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    with:
      concurrency_cancel: true
      # Wall-clock budget for the Run Claude Code Review step. Default 15 in
      # the reusable workflow; override at runtime by setting the
      # CLAUDE_REVIEW_TIMEOUT_MINUTES repo variable to e.g. '5' to fail fast
      # when a run hangs. Minimum 1; '0' is silently rejected by GitHub
      # Actions. GitHub variables are strings, so parse before passing.
      timeout_minutes: ${{ fromJSON(vars.CLAUDE_REVIEW_TIMEOUT_MINUTES || '15') }}
