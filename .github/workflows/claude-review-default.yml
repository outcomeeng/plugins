# Claude Review (default) — generic review prompt for this repository.
#
# Triggers on every PR and invokes the vendored reusable workflow at
# `./_claude-review.yml`. The reusable carries the authorize +
# validate-workflow gates and the Anthropic action invocation; this caller
# supplies the `pull_request` trigger and the generic review prompt.
#
# Pair with `claude-review-custom.yml` for the marketplace-specific
# `REVIEW.md` prompt.

name: Claude Review (default)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write
  # Required by the reusable workflow's OIDC exchange for the OAuth token.
  id-token: write

jobs:
  default-review:
    uses: ./.github/workflows/_claude-review.yml
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    with:
      concurrency_cancel: true
      # Wall-clock budget for the Run Claude Code Review step. Override at
      # runtime by setting the CLAUDE_REVIEW_TIMEOUT_MINUTES repo variable
      # (string, e.g. '5'). Minimum 1; '0' is silently rejected by GitHub.
      # GitHub variables are strings — pass them directly without fromJSON.
      timeout_minutes: ${{ vars.CLAUDE_REVIEW_TIMEOUT_MINUTES || '15' }}
      prompt: |
        REPO: ${{ github.repository }}
        PR NUMBER: ${{ github.event.pull_request.number }}

        Please review this pull request and provide feedback on:
        - Code quality and best practices
        - Potential bugs or issues
        - Performance considerations
        - Security concerns
        - Test coverage

        Use the repository's CLAUDE.md for guidance on style and conventions. Be constructive and helpful in your feedback.

        Use `gh pr comment` with your Bash tool to leave your review as a comment on the PR.
