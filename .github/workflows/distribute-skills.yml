name: Distribute Skills

on:
  push:
    branches: [main]
    paths:
      - ".claude-plugin/**"
      - ".agents/plugins/**"
      - "src/plugins/**"
      - "dist/claude/**"
      - "scripts/distribution.yml"
      - "outcomeeng/distribution/distribute.py"
      - ".github/workflows/distribute-skills.yml"

  workflow_dispatch:
    inputs:
      repo:
        description: "Distribute only this repo (leave empty for all)"
        required: false
        type: string

jobs:
  distribute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Distribute skills
        env:
          GH_TOKEN: ${{ secrets.SKILL_DISTRIBUTION_TOKEN }}
        run: |
          # Configure git to use the token for HTTPS pushes
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

          ARGS=()
          if [ -n "${{ inputs.repo }}" ]; then
            ARGS=(--repo "${{ inputs.repo }}")
          fi

          PYTHONPATH=. python -m outcomeeng.distribution.distribute "${ARGS[@]}"
