name: Native Profile Acceptance

# Retains release-acceptance artifacts for every native profile row and every
# native auditor-dispatch row on a hosted runner. It starts only when an
# operator with write access dispatches it; no push, pull request, or schedule
# starts a run. Each run carries exactly one Claude Code credential and the one
# Codex credential its explicit authentication mode selects, both from
# repository secrets through job environment. Governed by
# spx/32-distribution.enabler/21-installation.enabler/21-repository-installation.enabler/repository-installation.md.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_VERSION: "0.11.17" # renovate: datasource=github-releases depName=astral-sh/uv
      JUST_VERSION: "1.53.0" # renovate: datasource=github-releases depName=casey/just
      CLAUDE_CLI_VERSION: "2.1.168" # renovate: datasource=npm depName=@anthropic-ai/claude-code
      CODEX_CLI_VERSION: "0.162.1"
      ARTIFACT_ROOT: native-acceptance
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      SUBAGENT_DISCOVERY_AUTH_MODE: api
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # bun v1.3.14
        with:
          bun-version: "1.3.14"

      - name: Install just
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            -o just.tar.gz
          tar -xzf just.tar.gz just
          sudo install -m 0755 just /usr/local/bin/just
          just --version

      - name: Install agent CLIs (claude, codex)
        run: |
          set -euo pipefail
          bun add -g \
            "@anthropic-ai/claude-code@${CLAUDE_CLI_VERSION}" \
            "@openai/codex@${CODEX_CLI_VERSION}"
          echo "${BUN_INSTALL:-$HOME/.bun}/bin" >> "$GITHUB_PATH"
          export PATH="${BUN_INSTALL:-$HOME/.bun}/bin:$PATH"
          claude --version
          codex --version

      - name: Verify native profile execution
        run: just verify-native-profile-execution "${ARTIFACT_ROOT}/profiles"

      - name: Verify native auditor dispatch
        if: ${{ !cancelled() }}
        run: just verify-native-auditor-dispatch "${ARTIFACT_ROOT}/auditors"

      - name: Upload acceptance artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-profile-acceptance
          path: ${{ env.ARTIFACT_ROOT }}
          if-no-files-found: error
