name: Native Profile Acceptance

# Retains release-acceptance artifacts for every native profile row and every
# native auditor-dispatch row on a hosted runner. It starts only when an
# operator with write access dispatches it; no push, pull request, or schedule
# starts a run. Each run carries exactly one Claude Code credential and the one
# Codex credential its explicit authentication mode selects, both from
# repository secrets through job environment. Governed by
# spx/32-distribution.enabler/21-installation.enabler/21-repository-installation.enabler/repository-installation.md.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_VERSION: "0.11.17" # renovate: datasource=github-releases depName=astral-sh/uv
      JUST_VERSION: "1.53.0" # renovate: datasource=github-releases depName=casey/just
      ARTIFACT_ROOT: native-acceptance
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      SUBAGENT_DISCOVERY_AUTH_MODE: api
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}

      - name: Read tool pins from the quality gate workflow
        # The repository declares the spx revision and the agent CLI versions
        # once, in check.yml; this job reads them at run time.
        run: |
          set -euo pipefail
          for name in SPX_COMMIT CLAUDE_CLI_VERSION CODEX_CLI_VERSION; do
            value="$(sed -nE "s/^[[:space:]]+${name}:[[:space:]]*\"([^\"]+)\".*$/\1/p" .github/workflows/check.yml | head -n 1)"
            if [ -z "${value}" ]; then
              echo "check.yml declares no ${name}" >&2
              exit 1
            fi
            echo "${name}=${value}" >> "$GITHUB_ENV"
          done

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # bun v1.3.14
        with:
          bun-version: "1.3.14"

      - name: Set up Node
        # spx declares node >=24 and pins its package manager through corepack.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Build spx
        # Built from the revision check.yml pins, never from the npm registry.
        run: |
          set -euo pipefail
          source_dir="${RUNNER_TEMP}/spx-source"
          git init "${source_dir}"
          git -C "${source_dir}" fetch --depth 1 "https://github.com/outcomeeng/spx.git" "${SPX_COMMIT}"
          git -C "${source_dir}" checkout --detach FETCH_HEAD
          corepack enable
          cd "${source_dir}"
          pnpm install --frozen-lockfile
          pnpm run build
          chmod +x bin/spx.js
          mkdir -p "${RUNNER_TEMP}/spx-bin"
          ln -sf "${source_dir}/bin/spx.js" "${RUNNER_TEMP}/spx-bin/spx"
          echo "${RUNNER_TEMP}/spx-bin" >> "$GITHUB_PATH"
          export PATH="${RUNNER_TEMP}/spx-bin:$PATH"
          spx --version

      - name: Install just
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            -o just.tar.gz
          tar -xzf just.tar.gz just
          sudo install -m 0755 just /usr/local/bin/just
          just --version

      - name: Install agent CLIs (claude, codex)
        run: |
          set -euo pipefail
          bun add -g \
            "@anthropic-ai/claude-code@${CLAUDE_CLI_VERSION}" \
            "@openai/codex@${CODEX_CLI_VERSION}"
          echo "${BUN_INSTALL:-$HOME/.bun}/bin" >> "$GITHUB_PATH"
          export PATH="${BUN_INSTALL:-$HOME/.bun}/bin:$PATH"
          claude --version
          codex --version

      - name: Verify native profile execution
        run: just verify-native-profile-execution "${ARTIFACT_ROOT}/profiles"

      - name: Verify native auditor dispatch
        if: ${{ !cancelled() }}
        run: just verify-native-auditor-dispatch "${ARTIFACT_ROOT}/auditors"

      - name: Upload acceptance artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-profile-acceptance
          path: ${{ env.ARTIFACT_ROOT }}
          if-no-files-found: error
