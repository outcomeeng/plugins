# Product Tree Evals — runs the `[eval]`-lane suites through the
# `outcomeeng_evals` harness in CI.
#
# Why this is a direct-run job (not a thin caller of an
# outcomeeng/gh-actions reusable like spec-tree.yml / spec-tree-review.yml):
# the eval harness is THIS repo's own Python toolchain. It replays curated
# cases through `claude --print --output-format json --plugin-dir <dir>` and
# grades the structured verdict (see
# spx/13-infrastructure.enabler/25-eval-harness.enabler/eval-harness.md).
# anthropics/claude-code-action runs a single event-driven claude turn and
# posts a comment — it cannot replay-and-grade — so the harness drives
# `claude` itself. The gh-actions review workflow is the reference for HOW to
# launch claude in CI (install + CLAUDE_CODE_OAUTH_TOKEN auth), for the
# minimum configurable surface — not for the job shape.
#
# Trigger: `workflow_dispatch` only. No `pull_request`, `push`, or `schedule`
# event starts this workflow, so a run begins only when an operator with write
# access dispatches it. The OAuth secret reaches the `claude` subprocess, and
# the dispatcher's write access is the trust boundary: no untrusted pull
# request can start a run that exposes the secret.
#
# Scope: the workflow discovers eval.toml files under EVALS_ROOT and asks the
# `outcomeeng-evals ci` command which suites and cases to run. A dispatched run
# executes the full plan.
#
# CI owns the canonical history.jsonl appends (eval-harness.md:28): only on
# main the appended rows are committed back with [skip ci],
# authenticated by the org secret OUTCOMEENG_EVAL_STORE (a PAT, so the push
# survives main's upcoming branch protection — the built-in GITHUB_TOKEN
# cannot push to a protected branch). Full transcripts under each eval's
# runs/ directory are gitignored and never committed.

name: Product Tree Evals

on:
  workflow_dispatch:
    inputs:
      evals_root:
        description: "Directory tree to discover eval.toml files under."
        type: string
        default: spx
      plugin_dir:
        description: "Fallback plugin directory when an eval.toml omits plugin_dir."
        type: string
        default: dist/claude/product-tree
      workers:
        description: "Parallel case workers per suite (1-16)."
        type: string
        default: "1"
      max_budget_usd:
        description: "Per-invocation budget passed to the Claude CLI."
        type: string
        default: "0.75"
      timeout_seconds:
        description: "Per-invocation timeout for the Claude subprocess."
        type: string
        default: "180"

# Deny-all default; each job grants exactly what it needs.
permissions: {}

concurrency:
  # Per-ref, never cancelled, so a cancelled run cannot interrupt an in-flight
  # history.jsonl append (append_history_row is not file-locked).
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # read only: checkout clones with GITHUB_TOKEN; the history commit-back
      # pushes with the OUTCOMEENG_EVAL_STORE PAT, not GITHUB_TOKEN, so it
      # survives main's upcoming branch protection.
      contents: read
    env:
      # Auth for the `claude` subprocess the harness launches. Set as job env
      # (never interpolated into a run: body). The harness reads whatever auth
      # secrets the operator already provisioned via the inherited environment
      # per eval-harness.md.
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      # Optional auth source. If already provisioned, the runner derives
      # `--bare`; if absent or empty, the non-bare inherited-env path remains.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      EVALS_ROOT: ${{ github.event.inputs.evals_root || 'spx' }}
      PLUGIN_DIR: ${{ github.event.inputs.plugin_dir || 'dist/claude/product-tree' }}
      WORKERS: ${{ github.event.inputs.workers || '1' }}
      MAX_BUDGET_USD: ${{ github.event.inputs.max_budget_usd || '0.75' }}
      TIMEOUT_SECONDS: ${{ github.event.inputs.timeout_seconds || '180' }}
      # Pinned tool versions. Renovate advances these via the customManager
      # regex in renovate.json (the inline `# renovate:` annotations name the
      # datasource and package for each).
      CLAUDE_CLI_VERSION: "2.1.158" # renovate: datasource=npm depName=@anthropic-ai/claude-code
      UV_VERSION: "0.11.17" # renovate: datasource=github-releases depName=astral-sh/uv
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave GITHUB_TOKEN creds in .git/config: the eval steps only
          # read the tree, and the commit-back pushes with the PAT below (a
          # persisted GITHUB_TOKEN extraheader would otherwise shadow the PAT
          # on a same-repo push and fail once main is protected).
          persist-credentials: false
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install Bun
        # Provision the Claude Code CLI the same way anthropics/claude-code-action
        # does (the action that spec-tree.yml / spec-tree-review.yml rely on):
        # via Bun, pinned to the same setup-bun SHA and version the action pins.
        # Bun runs the package's postinstall (which fetches claude's platform-
        # native binary); pnpm blocks that postinstall by default, which left the
        # binary uninstalled.
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # bun v1.3.14
        with:
          bun-version: "1.3.14"

      - name: Install Claude Code CLI
        run: |
          set -euo pipefail
          # bun add -g installs into $BUN_INSTALL/bin, which setup-bun puts on
          # PATH; echo it to GITHUB_PATH so the later harness step finds the
          # `claude` binary (CLAUDE_BIN defaults to `claude`).
          bun add -g "@anthropic-ai/claude-code@${CLAUDE_CLI_VERSION}"
          echo "${BUN_INSTALL:-$HOME/.bun}/bin" >> "$GITHUB_PATH"
          export PATH="${BUN_INSTALL:-$HOME/.bun}/bin:$PATH"
          claude --version

      - name: Sync Python environment
        # Locked, wheels only: no third-party setup script runs on the runner.
        # The project itself is not installed here; the eval CLI runs as a
        # module from the checkout, and each suite's own `uv run` installs it.
        run: |
          set -euo pipefail
          uv sync --locked --no-build --no-install-project

      - name: Run eval suites
        run: |
          set -euo pipefail
          uv run --locked --no-sync --no-build python -m outcomeeng_evals ci "$EVALS_ROOT" \
            --mode full \
            --default-plugin-dir "$PLUGIN_DIR" \
            --workers "$WORKERS" \
            --max-budget-usd "$MAX_BUDGET_USD" \
            --timeout-seconds "$TIMEOUT_SECONDS"

      - name: Commit history.jsonl appends
        # Runs even when a suite fails (a failed run still records a history
        # row), but only on main where the canonical baseline lives.
        if: always() && github.ref == 'refs/heads/main'
        env:
          # Org-level PAT (contents:write) so the push survives main's branch
          # protection — GITHUB_TOKEN cannot push to a protected branch. Read
          # into env (never interpolated into the script body).
          EVAL_STORE_TOKEN: ${{ secrets.OUTCOMEENG_EVAL_STORE }}
        run: |
          set -euo pipefail
          if [ -z "${EVAL_STORE_TOKEN:-}" ]; then
            echo "::warning::OUTCOMEENG_EVAL_STORE is not available to this repo — skipping history commit-back. Confirm the org secret's repository visibility includes this repo (see this node's ISSUES.md)."
            exit 0
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # Stage ONLY history.jsonl files — never the gitignored runs/
          # transcripts, and nothing else the run might have touched.
          git add -- ':(glob)spx/**/evals/**/history.jsonl' || true
          if git diff --cached --quiet; then
            echo "No history.jsonl changes to commit."
            exit 0
          fi
          # Inject the PAT through url.insteadOf (same pattern as
          # distribute-skills.yml) so the token lives in git config, never on
          # a command line. [skip ci] stops the push from re-triggering this
          # workflow — a PAT push, unlike a GITHUB_TOKEN push, does fire events.
          git config --global url."https://x-access-token:${EVAL_STORE_TOKEN}@github.com/".insteadOf "https://github.com/"
          git commit -m "ci(evals): record CI eval history [skip ci]"
          # Rebase onto the current remote tip before pushing: a merge landing
          # on main during the eval run advances origin, making a bare push
          # non-fast-forward. The url.insteadOf rewrite above authenticates the
          # fetch.
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
