name: Refresh Root Instructions

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      UV_VERSION: "0.11.17" # renovate: datasource=github-releases depName=astral-sh/uv
      JUST_VERSION: "1.53.0" # renovate: datasource=github-releases depName=casey/just
      JUST_SHA256: "7fedeb22c7e14d9ef1551e8b793700866d80f409f9884b0e80ebb65c11d4874d"
      DPRINT_VERSION: "0.54.0" # renovate: datasource=npm depName=dprint
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install just
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          curl -fsSL \
            "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            -o "$tmp/just.tar.gz"
          printf '%s  %s\n' "$JUST_SHA256" "$tmp/just.tar.gz" | sha256sum -c -
          tar -xzf "$tmp/just.tar.gz" -C "$tmp" just
          sudo install -m 0755 "$tmp/just" /usr/local/bin/just
          just --version

      - name: Install Bun
        # dprint provisions the build's Markdown formatter for generated dist output;
        # `just build-skills` fails without it. Bun runs the npm package's postinstall,
        # which fetches the platform-native binary.
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # bun v1.3.14
        with:
          bun-version: "1.3.14"

      - name: Install dprint
        run: |
          set -euo pipefail
          bun add -g "dprint@${DPRINT_VERSION}"
          echo "${BUN_INSTALL:-$HOME/.bun}/bin" >> "$GITHUB_PATH"
          export PATH="${BUN_INSTALL:-$HOME/.bun}/bin:$PATH"
          dprint --version

      - name: Regenerate instruction blocks
        run: |
          set -euo pipefail
          just build-skills
          just build-instructions

      - name: Open instruction-block refresh pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "Root instruction blocks are current."
            exit 0
          fi

          branch="automation/refresh-instruction-blocks"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          for path in AGENTS.md CLAUDE.md dist/claude dist/codex spx/AGENTS.md spx/CLAUDE.md; do
            if [ -e "$path" ] || git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              git add -A "$path"
            fi
          done
          git commit -m "Refresh root instruction blocks"
          git push --force-with-lease origin "$branch"

          existing_pr="$(
            gh pr list \
              --head "$branch" \
              --base main \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"
          if [ -n "$existing_pr" ]; then
            echo "Updated existing pull request #${existing_pr}."
            exit 0
          fi

          gh pr create \
            --base main \
            --head "$branch" \
            --title "Refresh root instruction blocks" \
            --body "Regenerates root CLAUDE.md and AGENTS.md managed Spec Tree instruction blocks from the committed harness templates."
