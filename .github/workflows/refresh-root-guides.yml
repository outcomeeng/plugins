name: Refresh Root Guides

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      UV_VERSION: "0.11.17" # renovate: datasource=github-releases depName=astral-sh/uv
      JUST_VERSION: "1.53.0" # renovate: datasource=github-releases depName=casey/just
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install just
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            -o just.tar.gz
          tar -xzf just.tar.gz just
          sudo install -m 0755 just /usr/local/bin/just
          just --version

      - name: Regenerate guide sections
        run: |
          set -euo pipefail
          just build-skills
          just build-guides

      - name: Open guide refresh pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "Root guide sections are current."
            exit 0
          fi

          branch="automation/refresh-root-guides"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          for path in AGENTS.md CLAUDE.md dist/claude dist/codex spx/AGENTS.md spx/CLAUDE.md; do
            if [ -e "$path" ] || git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              git add -A "$path"
            fi
          done
          git commit -m "Refresh root guide sections"
          git push --force-with-lease origin "$branch"

          existing_pr="$(
            gh pr list \
              --head "$branch" \
              --base main \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"
          if [ -n "$existing_pr" ]; then
            echo "Updated existing pull request #${existing_pr}."
            exit 0
          fi

          gh pr create \
            --base main \
            --head "$branch" \
            --title "Refresh root guide sections" \
            --body "Regenerates root CLAUDE.md and AGENTS.md managed Spec Tree sections from the committed harness templates."
