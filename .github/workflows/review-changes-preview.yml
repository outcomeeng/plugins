name: Review Changes Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  review-changes-preview:
    runs-on: ubuntu-latest
    env:
      CLAUDE_CLI_VERSION: "2.1.168" # renovate: datasource=npm depName=@anthropic-ai/claude-code
      SPX_VERSION: "0.6.3" # renovate: datasource=npm depName=@outcomeeng/spx
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # bun v1.3.14
        with:
          bun-version: "1.3.14"

      - name: Install review CLIs
        run: |
          set -euo pipefail
          bun add -g \
            "@anthropic-ai/claude-code@${CLAUDE_CLI_VERSION}" \
            "@outcomeeng/spx@${SPX_VERSION}"
          echo "${BUN_INSTALL:-$HOME/.bun}/bin" >> "$GITHUB_PATH"
          export PATH="${BUN_INSTALL:-$HOME/.bun}/bin:$PATH"
          claude --version
          spx --version

      - name: Run review-changes skill
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SPX_VERIFY_BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/main' }}
          SPX_VERIFY_HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          REVIEW_CHANGES_BRANCH_NAME: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          journal_branch="$(
            python3 - <<'PY'
          import importlib.util
          import pathlib
          import os

          path = pathlib.Path("dist/claude/spec-tree/skills/scope-changeset/scripts/changeset_scope.py")
          spec = importlib.util.spec_from_file_location("changeset_scope", path)
          if spec is None or spec.loader is None:
              raise SystemExit("could not load changeset_scope")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          print(module.branch_slug(os.environ["REVIEW_CHANGES_BRANCH_NAME"]))
          PY
          )"
          export SPX_VERIFY_BRANCH="${journal_branch}"

          printf '%s\n' \
            'Use the spec-tree:review-changes skill for the exported SPX_VERIFY_BASE_REF..SPX_VERIFY_HEAD_REF scope. Return only the raw run token printed by the skill. Do not render, summarize, post comments, run tests, or run validation.' \
            | claude \
            --print \
            --output-format text \
            --no-session-persistence \
            --permission-mode dontAsk \
            --plugin-dir dist/claude/spec-tree \
            --allowed-tools "Skill,Read,Bash(python3 *scripts/review_run.py*)" \
            > review-run-token.txt

          run_token="$(sed -n '/[^[:space:]]/p' review-run-token.txt | tail -n 1)"
          if [ -z "${run_token}" ]; then
            echo "::error::review-changes did not return a run token"
            exit 1
          fi
          if ! printf '%s\n' "${run_token}" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}_[0-9]{2}-[0-9]{2}-[0-9]{2}-[0-9]{3}-[0-9a-f]+$'; then
            echo "::error::review-changes returned an invalid run token"
            cat review-run-token.txt
            exit 1
          fi

          SPX_VERIFY_BRANCH="${journal_branch}" spx journal render --type review --run "${run_token}" > review-preview.txt
          {
            echo "## review-changes preview"
            echo
            echo "Run token: \`${run_token}\`"
            echo
            echo '```text'
            cat review-preview.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
