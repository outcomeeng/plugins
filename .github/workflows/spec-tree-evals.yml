# Spec Tree Evals — runs the `[eval]`-lane suites through the
# `outcomeeng_evals` harness in CI.
#
# Why this is a direct-run job (not a thin caller of an
# outcomeeng/gh-actions reusable like spec-tree.yml / spec-tree-review.yml):
# the eval harness is THIS repo's own Python toolchain. It replays curated
# cases through `claude --print --output-format json --plugin-dir <dir>` and
# grades the structured verdict (see
# spx/13-infrastructure.enabler/25-eval-harness.enabler/eval-harness.md).
# anthropics/claude-code-action runs a single event-driven claude turn and
# posts a comment — it cannot replay-and-grade — so the harness drives
# `claude` itself. The gh-actions review workflow is the reference for HOW to
# launch claude in CI (install + CLAUDE_CODE_OAUTH_TOKEN auth), for the
# minimum configurable surface, and for the authorize gate below — not for
# the job shape.
#
# Triggers: every `pull_request` that touches an eval-owned spec or skill
# surface, plus `push` to main for the same paths, a weekly `schedule`, and
# manual `workflow_dispatch`. A change to the workflow file itself is not a
# trigger path — validate workflow edits via `workflow_dispatch`. The OAuth
# secret reaches the `claude` subprocess, so every PR run is gated by the
# `authorize` job: only a PR whose author has admin/maintain/write permission
# runs (fork/external PRs are skipped, and GitHub withholds secrets from fork
# `pull_request` runs regardless). The trust boundary matches
# spec-tree-review's: a PR editing an eval prompt.md could otherwise instruct
# claude to exfiltrate the token, so only trusted authors' PRs execute.
#
# Scope: the workflow discovers eval.toml files under EVALS_ROOT and asks the
# `outcomeeng-evals plan` command which suites and cases to run. PR runs use
# changed paths and each suite's `owned_paths` / `smoke_cases` metadata, so a
# skill-only edit runs a small canary set. Eval-definition changes and harness
# changes run the full affected suites. Push, schedule, and manual runs use the
# full plan.
#
# CI owns the canonical history.jsonl appends (eval-harness.md:28): only on
# main (not on PR runs) the appended rows are committed back with [skip ci],
# authenticated by the org secret OUTCOMEENG_EVAL_STORE (a PAT, so the push
# survives main's upcoming branch protection — the built-in GITHUB_TOKEN
# cannot push to a protected branch). Full transcripts under each eval's
# runs/ directory are gitignored and never committed.

name: Spec Tree Evals

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # A path-filtered workflow is absent (not "skipped") on non-matching PRs,
    # so do not mark it a required status check without a separate always-runs
    # gate job.
    paths:
      - "spx/15-merging.pdr.md"
      - "spx/21-spec-tree.enabler/68-reviewing.enabler/21-reviewing-changes.enabler/**"
      - "spx/21-spec-tree.enabler/76-merging.enabler/32-github-pr.enabler/**"
      - "spx/43-typescript.enabler/25-typescript-standards.enabler/25-typescript-tests.enabler/32-test-data-ownership.enabler/**"
      - "src/plugins/spec-tree/skills/github-pr/**"
      - "src/plugins/spec-tree/skills/managing-pr/**"
      - "src/plugins/spec-tree/skills/opening-pr/**"
      - "src/plugins/spec-tree/skills/reviewing-changes/**"
      - "src/plugins/spec-tree/skills/standardizing-merging/**"
      - "src/plugins/typescript/skills/standardizing-typescript-tests/**"
      - "src/plugins/typescript/skills/testing-typescript/**"
      - "dist/claude/spec-tree/skills/github-pr/**"
      - "dist/claude/spec-tree/skills/managing-pr/**"
      - "dist/claude/spec-tree/skills/opening-pr/**"
      - "dist/claude/spec-tree/skills/reviewing-changes/**"
      - "dist/claude/spec-tree/skills/standardizing-merging/**"
      - "dist/claude/typescript/skills/standardizing-typescript-tests/**"
      - "dist/claude/typescript/skills/testing-typescript/**"
      - "outcomeeng_evals/**"
      - "outcomeeng_testing/evals/**"
  push:
    branches: [main]
    # Same scope as the PR filter — a change to this workflow file itself does
    # not refresh the baseline; dispatch it when a workflow edit needs a run.
    paths:
      - "spx/15-merging.pdr.md"
      - "spx/21-spec-tree.enabler/68-reviewing.enabler/21-reviewing-changes.enabler/**"
      - "spx/21-spec-tree.enabler/76-merging.enabler/32-github-pr.enabler/**"
      - "spx/43-typescript.enabler/25-typescript-standards.enabler/25-typescript-tests.enabler/32-test-data-ownership.enabler/**"
      - "src/plugins/spec-tree/skills/github-pr/**"
      - "src/plugins/spec-tree/skills/managing-pr/**"
      - "src/plugins/spec-tree/skills/opening-pr/**"
      - "src/plugins/spec-tree/skills/reviewing-changes/**"
      - "src/plugins/spec-tree/skills/standardizing-merging/**"
      - "src/plugins/typescript/skills/standardizing-typescript-tests/**"
      - "src/plugins/typescript/skills/testing-typescript/**"
      - "dist/claude/spec-tree/skills/github-pr/**"
      - "dist/claude/spec-tree/skills/managing-pr/**"
      - "dist/claude/spec-tree/skills/opening-pr/**"
      - "dist/claude/spec-tree/skills/reviewing-changes/**"
      - "dist/claude/spec-tree/skills/standardizing-merging/**"
      - "dist/claude/typescript/skills/standardizing-typescript-tests/**"
      - "dist/claude/typescript/skills/testing-typescript/**"
      - "outcomeeng_evals/**"
      - "outcomeeng_testing/evals/**"
  schedule:
    # Weekly, Monday 06:00 UTC. Start here; tighten if drift signals warrant.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      evals_root:
        description: "Directory tree to discover eval.toml files under."
        type: string
        default: spx
      plugin_dir:
        description: "Fallback plugin directory when an eval.toml omits plugin_dir."
        type: string
        default: dist/claude/spec-tree
      workers:
        description: "Parallel case workers per suite (1-16)."
        type: string
        default: "1"
      max_budget_usd:
        description: "Per-invocation budget passed to the Claude CLI."
        type: string
        default: "0.50"
      timeout_seconds:
        description: "Per-invocation timeout for the Claude subprocess."
        type: string
        default: "120"

# Deny-all default; each job grants exactly what it needs.
permissions: {}

concurrency:
  # Per-PR on pull_request (a new push cancels the prior PR run to save eval
  # spend); per-ref otherwise, and never cancelled on main/schedule so a
  # cancelled run cannot interrupt an in-flight history.jsonl append
  # (append_history_row is not file-locked).
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  authorize:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      authorized: ${{ steps.check.outputs.authorized }}
    steps:
      - name: Check authorization
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Non-PR events are inherently trusted: only collaborators can land
          # a commit on main or dispatch a run, and schedule runs on the repo.
          if [ "$EVENT" != "pull_request" ]; then
            echo "authorized=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Fork PRs do not receive secrets (GitHub withholds everything but
          # GITHUB_TOKEN for `pull_request` from a fork), so the eval job would
          # run without CLAUDE_CODE_OAUTH_TOKEN and fail at auth rather than
          # skip. Skip them here — even a collaborator's fork branch — so only
          # same-repo PRs, which do receive the secret, run the eval.
          if [ "$PR_HEAD_REPO" != "$REPO" ]; then
            echo "::notice::PR head '$PR_HEAD_REPO' is a fork of '$REPO'; skipping eval (fork PRs do not receive the OAuth secret)."
            echo "authorized=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$PR_AUTHOR" ]; then
            echo "::notice::No PR author in the event payload; skipping eval."
            echo "authorized=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          perm=$(gh api "repos/$REPO/collaborators/$PR_AUTHOR/permission" --jq '.permission' 2>/dev/null || echo "none")
          case "$perm" in
            admin | maintain | write)
              echo "PR author '$PR_AUTHOR' has '$perm' permission — eval authorized"
              echo "authorized=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::notice::PR author '$PR_AUTHOR' has '$perm' permission; skipping eval (the OAuth secret is not exposed to untrusted PRs)."
              echo "authorized=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

  evals:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    permissions:
      # read only: checkout clones with GITHUB_TOKEN; the history commit-back
      # pushes with the OUTCOMEENG_EVAL_STORE PAT, not GITHUB_TOKEN, so it
      # survives main's upcoming branch protection.
      contents: read
    env:
      # Auth for the `claude` subprocess the harness launches. Set as job env
      # (never interpolated into a run: body). The harness reads it via the
      # inherited environment per eval-harness.md:16.
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      EVALS_ROOT: ${{ github.event.inputs.evals_root || 'spx' }}
      PLUGIN_DIR: ${{ github.event.inputs.plugin_dir || 'dist/claude/spec-tree' }}
      WORKERS: ${{ github.event.inputs.workers || '1' }}
      MAX_BUDGET_USD: ${{ github.event.inputs.max_budget_usd || '0.50' }}
      TIMEOUT_SECONDS: ${{ github.event.inputs.timeout_seconds || '120' }}
      # Pinned tool versions. Renovate advances these via the customManager
      # regex in renovate.json (the inline `# renovate:` annotations name the
      # datasource and package for each).
      CLAUDE_CLI_VERSION: "2.1.158" # renovate: datasource=npm depName=@anthropic-ai/claude-code
      UV_VERSION: "0.11.17" # renovate: datasource=github-releases depName=astral-sh/uv
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Don't leave GITHUB_TOKEN creds in .git/config: the eval steps only
          # read the tree, and the commit-back pushes with the PAT below (a
          # persisted GITHUB_TOKEN extraheader would otherwise shadow the PAT
          # on a same-repo push and fail once main is protected).
          persist-credentials: false
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install Bun
        # Provision the Claude Code CLI the same way anthropics/claude-code-action
        # does (the action that spec-tree.yml / spec-tree-review.yml rely on):
        # via Bun, pinned to the same setup-bun SHA and version the action pins.
        # Bun runs the package's postinstall (which fetches claude's platform-
        # native binary); pnpm blocks that postinstall by default, which left the
        # binary uninstalled.
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # bun v1.3.14
        with:
          bun-version: "1.3.14"

      - name: Install Claude Code CLI
        run: |
          set -euo pipefail
          # bun add -g installs into $BUN_INSTALL/bin, which setup-bun puts on
          # PATH; echo it to GITHUB_PATH so the later harness step finds the
          # `claude` binary (CLAUDE_BIN defaults to `claude`).
          bun add -g "@anthropic-ai/claude-code@${CLAUDE_CLI_VERSION}"
          echo "${BUN_INSTALL:-$HOME/.bun}/bin" >> "$GITHUB_PATH"
          export PATH="${BUN_INSTALL:-$HOME/.bun}/bin:$PATH"
          claude --version

      - name: Sync Python environment
        run: |
          set -euo pipefail
          uv sync

      - name: Collect changed paths
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            git diff --name-only --diff-filter=ACDMRT \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}" \
              > changed-paths.txt
          else
            : > changed-paths.txt
          fi

      - name: Plan eval suites
        env:
          CI_MODE: ${{ github.event_name == 'pull_request' && 'pr' || 'full' }}
        run: |
          set -euo pipefail
          uv run outcomeeng-evals plan "$EVALS_ROOT" \
            --mode "$CI_MODE" \
            --changed-paths-file changed-paths.txt \
            --default-plugin-dir "$PLUGIN_DIR" \
            > eval-plan.json
          python3 -m json.tool eval-plan.json

      - name: Run eval suites
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import os
          import subprocess
          import sys

          with open("eval-plan.json", encoding="utf-8") as fh:
              plan = json.load(fh)

          if not plan:
              print("No eval suites selected for this change.")
              sys.exit(0)

          print(f"Selected {len(plan)} eval suite invocation(s):")
          for item in plan:
              case_suffix = ""
              if item["case_ids"]:
                  case_suffix = " cases=" + ",".join(item["case_ids"])
              print(f"  {item['eval_toml']} plugin={item['plugin_dir']}{case_suffix}")

          failed = False
          for item in plan:
              print(f"::group::eval {item['eval_toml']}")
              command = [
                  "uv",
                  "run",
                  "outcomeeng-evals",
                  "run",
                  item["eval_toml"],
                  "--plugin-dir",
                  item["plugin_dir"],
                  "--workers",
                  os.environ["WORKERS"],
                  "--max-budget-usd",
                  os.environ["MAX_BUDGET_USD"],
                  "--timeout-seconds",
                  os.environ["TIMEOUT_SECONDS"],
              ]
              for case_id in item["case_ids"]:
                  command.extend(("--case-id", case_id))
              completed = subprocess.run(command, check=False)
              if completed.returncode != 0:
                  print(f"::error::Eval suite below threshold or errored: {item['eval_toml']}")
                  failed = True
              print("::endgroup::")

          sys.exit(1 if failed else 0)
          PY

      - name: Commit history.jsonl appends
        # Runs even when a suite fails (a failed run still records a history
        # row), but only on main where the canonical baseline lives — never on
        # PR runs (github.ref is refs/pull/<n>/merge there).
        if: always() && github.ref == 'refs/heads/main'
        env:
          # Org-level PAT (contents:write) so the push survives main's branch
          # protection — GITHUB_TOKEN cannot push to a protected branch. Read
          # into env (never interpolated into the script body).
          EVAL_STORE_TOKEN: ${{ secrets.OUTCOMEENG_EVAL_STORE }}
        run: |
          set -euo pipefail
          if [ -z "${EVAL_STORE_TOKEN:-}" ]; then
            echo "::warning::OUTCOMEENG_EVAL_STORE is not available to this repo — skipping history commit-back. Confirm the org secret's repository visibility includes this repo (see this node's ISSUES.md)."
            exit 0
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # Stage ONLY history.jsonl files — never the gitignored runs/
          # transcripts, and nothing else the run might have touched.
          git add -- ':(glob)spx/**/evals/**/history.jsonl' || true
          if git diff --cached --quiet; then
            echo "No history.jsonl changes to commit."
            exit 0
          fi
          # Inject the PAT through url.insteadOf (same pattern as
          # distribute-skills.yml) so the token lives in git config, never on
          # a command line. [skip ci] stops the push from re-triggering this
          # workflow — a PAT push, unlike a GITHUB_TOKEN push, does fire events.
          git config --global url."https://x-access-token:${EVAL_STORE_TOKEN}@github.com/".insteadOf "https://github.com/"
          git commit -m "ci(evals): record CI eval history [skip ci]"
          # Rebase onto the current remote tip before pushing: a merge landing
          # on main during the eval run advances origin, making a bare push
          # non-fast-forward. The url.insteadOf rewrite above authenticates the
          # fetch.
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
