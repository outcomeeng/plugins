# Spec Tree Evals — runs the `[eval]`-lane suites through the
# `outcomeeng_evals` harness in CI.
#
# Why this is a direct-run job (not a thin caller of an
# outcomeeng/gh-actions reusable like spec-tree.yml / spec-tree-review.yml):
# the eval harness is THIS repo's own Python toolchain. It replays curated
# cases through `claude --print --output-format json --plugin-dir <dir>` and
# grades the structured verdict (see
# spx/13-infrastructure.enabler/25-eval-harness.enabler/eval-harness.md).
# anthropics/claude-code-action runs a single event-driven claude turn and
# posts a comment — it cannot replay-and-grade — so the harness drives
# `claude` itself. The gh-actions review workflow is the reference for HOW to
# launch claude in CI (install + CLAUDE_CODE_OAUTH_TOKEN auth), for the
# minimum configurable surface, and for the authorize gate below — not for
# the job shape.
#
# Triggers: every `pull_request` that touches an eval-owned spec or skill
# surface, plus `push` to main for the same paths, a weekly `schedule`, and
# manual `workflow_dispatch`. Both `paths:` blocks are GENERATED from the eval
# definitions by `outcomeeng-evals materialize-ci-triggers` (`just
# build-eval-triggers`); the gate's `eval-triggers` step fails on drift. Edit
# an eval's `owned_paths`, never these lists. A change to the workflow file
# itself is not a trigger path — validate workflow edits via
# `workflow_dispatch`. The OAuth
# secret reaches the `claude` subprocess, so every PR run is gated by the
# `authorize` job: only a PR whose author has admin/maintain/write permission
# runs (fork/external PRs are skipped, and GitHub withholds secrets from fork
# `pull_request` runs regardless). The trust boundary matches
# spec-tree-review's: a PR editing an eval prompt.md could otherwise instruct
# claude to exfiltrate the token, so only trusted authors' PRs execute.
#
# Scope: the workflow discovers eval.toml files under EVALS_ROOT and asks the
# `outcomeeng-evals ci` command which suites and cases to run. PR runs use
# changed paths and each suite's `owned_paths` / `smoke_cases` metadata, so a
# skill-only edit runs a small canary set. Eval-definition changes and harness
# changes run the full affected suites. Push, schedule, and manual runs use the
# full plan.
#
# CI owns the canonical history.jsonl appends (eval-harness.md:28): only on
# main (not on PR runs) the appended rows are committed back with [skip ci],
# authenticated by the org secret OUTCOMEENG_EVAL_STORE (a PAT, so the push
# survives main's upcoming branch protection — the built-in GITHUB_TOKEN
# cannot push to a protected branch). Full transcripts under each eval's
# runs/ directory are gitignored and never committed.

