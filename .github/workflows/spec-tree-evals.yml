      - "dist/codex/spec-tree/skills/audit-tests/SKILL.md"
      - "dist/codex/spec-tree/skills/test-evidence-standards/SKILL.md"
      - "outcomeeng_evals/**"
      - "outcomeeng_testing/evals/**"
