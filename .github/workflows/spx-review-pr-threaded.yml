# Combined PR review + audit, threaded (with prior-verdict ingest from the PR comment thread).
#
# Invokes the spec-tree `pr-review-orchestrator` agent, which runs the PR
# review and the audit over the PR diff, ingests the prior audit verdict from
# the PR's existing comments, derives resolved + reopened by diffing new
# findings against the prior verdict, and posts one fresh combined comment
# that supersedes the prior audit (the review prose, then the audit verdict
# rendered as the markdown+json carrier).
#
# Calls the vendored reusable workflow at
# `./.github/workflows/_claude-review-reusable.yml` so the only external
# dependency is `anthropics/claude-code-action` (pinned inside the reusable),
# not a second indirection through `outcomeeng/gh-actions`.
#
# Transitional: `spx-review-pr.yml` (the one-shot review + audit workflow)
# runs alongside this one until this one is proven, then it is removed.
# Both gates are independent so a maintainer can A/B their output on the
# same PR by enabling both during validation.
#
# Note: the reusable workflow's validate-workflow gate requires this caller
# file to exist on the default branch with identical content before the
# Anthropic action runs. Until this file lands on the default branch, only
# `spx-review-pr.yml` (or `claude-code-review.yml`) produces a review.

name: SPX Review PR (threaded)

on:
  # `pull_request` (not `pull_request_target`) is the safe choice: secrets are
  # available only to PRs from branches in this repo. Fork PRs run without
  # CLAUDE_CODE_OAUTH_TOKEN and therefore receive no review — that is intended.
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write
  # Required by the reusable workflow's OIDC exchange for the OAuth token.
  id-token: write

concurrency:
  group: spx-review-pr-threaded-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review-threaded:
    # Disabled by default. To enable, set the repository variable
    # `SPX_REVIEW_PR_THREADED` to the literal string `true`:
    #   gh variable set SPX_REVIEW_PR_THREADED --body true
    # Unset or any other value skips the job. The one-shot variant is gated
    # independently via `SPX_REVIEW_PR` — see `spx-review-pr.yml`.
    if: ${{ vars.SPX_REVIEW_PR_THREADED == 'true' }}
    uses: ./.github/workflows/_claude-review-reusable.yml
    with:
      # Stream the agent's full SDK transcript into the job log while the
      # threaded reviewer surface is under active development. Flip to
      # `false` (or drop the input) once the agent is stable — the transcript
      # can include file contents the agent read and verbatim prompt
      # material, so it is not appropriate for a public-by-default reviewer.
      show_full_output: true
      custom_prompt: |
        REPO: ${{ github.repository }}
        PR NUMBER: ${{ github.event.pull_request.number }}

        Re-review and audit this pull request by invoking the pr-review-orchestrator agent (from the spec-tree plugin). The agent runs the PR review and the audit over the PR diff, ingests the prior audit verdict from the PR's existing comments via read_verdict.py (driven through the /spec-tree:auditing skill), derives resolved + reopened by diffing new findings against the prior verdict, and posts one fresh combined comment via gh pr comment that supersedes the prior audit: the review prose, then the audit verdict rendered as the markdown+json carrier (markdown table including resolved and reopened, followed by the delimiter-wrapped JSON block). Post exactly one comment.
      # `Bash(uv:*)` is permitted for the reusable workflow harness (which uses
      # uv to bootstrap its own runtime); the spec-tree skills themselves never
      # invoke uv per the AGENTS.md portability constraints. The extra
      # `gh pr view`, `gh pr comment`, and `gh api` permissions are required
      # for prior-verdict ingest and supersession of the previous audit comment.
      append_allow_list: "Bash(just:*),Bash(python3:*),Bash(uv:*),Bash(git diff:*),Bash(git log:*),Bash(git rev-parse:*),Bash(git symbolic-ref:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(gh api:*)"
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
