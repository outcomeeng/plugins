# Combined PR review + audit (one-shot, no prior-verdict ingest).
#
# Invokes the spec-tree `pr-reviewer` agent, which runs the PR review and the
# audit over the PR diff and posts one combined comment (the review prose,
# then the audit verdict rendered as the markdown+json carrier). Each push to
# the PR posts a fresh comment; prior audit comments are not read or
# superseded — for that, see `spx-review-pr-threaded.yml`.
#
# Calls the vendored reusable workflow at
# `./.github/workflows/_claude-review.yml` so the only external
# dependency is `anthropics/claude-code-action` (pinned inside the reusable),
# not a second indirection through `outcomeeng/gh-actions`.
#
# Transitional: `claude-code-review.yml` (the generic review-only workflow)
# runs alongside this one until this one is proven, then it is removed.
#
# Note: the reusable workflow's validate-workflow gate requires this caller
# file to exist on the default branch with identical content before the
# Anthropic action runs. Until this file lands on the default branch, only
# `claude-code-review.yml` produces a review.

name: SPX Review PR

on:
  # `pull_request` (not `pull_request_target`) is the safe choice: secrets are
  # available only to PRs from branches in this repo. Fork PRs run without
  # CLAUDE_CODE_OAUTH_TOKEN and therefore receive no review — that is intended.
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write
  # Required by the reusable workflow's OIDC exchange for the OAuth token.
  id-token: write

concurrency:
  group: spx-review-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Disabled by default. To enable, set the repository variable
    # `SPX_REVIEW_PR` to the literal string `true`:
    #   gh variable set SPX_REVIEW_PR --body true
    # Unset or any other value skips the job, leaving claude-code-review.yml
    # as the sole reviewer. The threaded variant is gated independently via
    # `SPX_REVIEW_PR_THREADED` — see `spx-review-pr-threaded.yml`.
    if: ${{ vars.SPX_REVIEW_PR == 'true' }}
    uses: ./.github/workflows/_claude-review.yml
    with:
      # The one-shot reviewer invokes the spec-tree pr-reviewer agent,
      # which requires the spec-tree plugin to be loaded.
      use_project_plugins: true
      # Stream the agent's full SDK transcript into the job log while the
      # reviewer surface is under active development. Flip to `false` (or
      # drop the input) once the agent is stable — the transcript can include
      # file contents the agent read and verbatim prompt material, so it is
      # not appropriate for a public-by-default reviewer.
      show_full_output: true
      prompt: |
        REPO: ${{ github.repository }}
        PR NUMBER: ${{ github.event.pull_request.number }}

        Review and audit this pull request by invoking the pr-reviewer agent (from the spec-tree plugin). The agent runs the PR review and the audit over the PR diff and posts one combined comment via gh pr comment: the review prose, then the audit verdict rendered as the markdown+json carrier (markdown table followed by the delimiter-wrapped JSON block). Post exactly one comment.
      # `Bash(uv:*)` is permitted for the reusable workflow harness (which uses
      # uv to bootstrap its own runtime); the spec-tree skills themselves never
      # invoke uv per the AGENTS.md portability constraints.
      append_allow_list: "Bash(just:*),Bash(python3:*),Bash(uv:*),Bash(git diff:*),Bash(git log:*),Bash(git rev-parse:*),Bash(git symbolic-ref:*)"
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
