sonar.python.version=3.13, 3.14
sonar.exclusions=dist/**,\
  .github/workflows/spec-tree.yml,\
  .github/workflows/spec-tree-review.yml
# Copy-paste detection excludes the generated trees, and the contribute
# plugin's consumer entrypoints. Those five files are identical by decision:
# spx/13-plugin-and-runtime-conventions.adr.md requires every skill's tool
# grants to name only its own directory, so each consuming skill owns an
# entrypoint that reaches the shared resolver, and the decision names that
# duplicate file as its accepted cost. Removing the duplication means
# reinstating the cross-skill grants the decision forbids.
sonar.cpd.exclusions=dist/**,\
  src/plugins/contribute/skills/*/scripts/resolve_target.py
