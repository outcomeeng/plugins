schema_version = 1
slug = "platform"
title = "Self-hosted multi-tenant platform"
summary = "A self-hosted service that runs isolated per-tenant runtimes with shared infrastructure, where tenancy, isolation, and autonomy are governed by cross-cutting decisions rather than nodes."

source_product = "leoherd"
source_repo = "leoherds/leoherd"

[recognition]
# Mechanical signals the router reads from a new product's product.md.
user_plurality = "multi-tenant" # one or more isolated principals/profiles, not anonymous public
behavior_measurability = "determined" # services behave to spec; productivity measured per-principal
primary_surface = ["deployed-service", "chat", "api"]
decomposition_driver = "tenancy-isolation-plus-runtime-infrastructure"
governance_weight = "heavy"
deployment_model = "self-hosted-multi-tenant"

[outcome_topology]
has_outcomes = false
reason = "Self-hosted services with determined behavior; tenants are few and known, and any productivity goal is measured per-principal rather than as a multi-user behavior bet. Tenancy and safety are governed by decisions, not modeled as outcome bets, so every node is an enabler."

[index_convention]
decisions = "15-20"
enablers = "21-50"
outcomes = "51-79"
max = 79

[concerns]
core = ["infrastructure", "capabilities"]
optional = []

[governance]
# The platform signature: cross-cutting policies every node honors live as root decisions, not nodes.
# Seed these decision topics prominently.
decisions = ["isolation-model", "autonomy-model", "architecture", "application-services", "operational-runbook"]
