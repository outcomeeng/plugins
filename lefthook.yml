pre-commit:
  commands:
    fix-xml-spacing:
      glob: "*.md"
      run: uv run python -m outcomeeng.hygiene.xml_spacing {staged_files}
      stage_fixed: true
      priority: 0
    validate-skill-frontmatter:
      glob: "**/SKILL.md"
      run: uv run python -m outcomeeng.validation.skill_frontmatter {staged_files}
      priority: 5
    validate-plugins:
      glob: "*.json"
      run: uv run python -m outcomeeng.validation.plugins .
      priority: 10
    build-skills:
      glob: "*.{md,json,toml,py}"
      run: just build-skills && uv run python -m outcomeeng.distribution.dist_diff
      stage_fixed: true
      priority: 20
    regenerate-spx-guides:
      glob: "{src/plugins/spec-tree/skills/understand/templates/spx-claude.md,spx/**/tests/*}"
      run: python3 src/plugins/spec-tree/skills/update-spx/scripts/update_spx.py --template src/plugins/spec-tree/skills/understand/templates/spx-claude.md --spx-dir spx --write
      stage_fixed: true
      priority: 25
    dprint:
      glob: "*.{md,python,ts,js,json,jsonc}"
      run: dprint fmt {staged_files}
      stage_fixed: true
      priority: 100
