pre-commit:
  commands:
    fix-xml-spacing:
      glob: "*.md"
      run: uv run python -m outcomeeng.hygiene.xml_spacing {staged_files}
      stage_fixed: true
      priority: 0
    validate-skill-frontmatter:
      glob: "**/SKILL.md"
      # src/templates holds unrendered templates whose frontmatter carries build
      # tokens in place of values; only their per-plugin renders under dist/ are
      # real skill frontmatter, as the check-skills recipe states.
      exclude:
        - "src/templates/**"
      run: uv run python -m outcomeeng.validation.skill_frontmatter {staged_files}
      priority: 5
    validate-plugins:
      glob: "*.json"
      run: uv run python -m outcomeeng.validation.plugins .
      priority: 10
    build-skills:
      glob: "*.{md,json,toml,py}"
      run: just build-skills && uv run python -m outcomeeng.distribution.dist_diff
      stage_fixed: true
      priority: 20
    regenerate-instruction-blocks:
      glob: "{src/plugins/product-tree/skills/update-instruction-block/templates/instruction-block.md,src/plugins/product-tree/skills/update-instruction-block/scripts/instruction_block.py,spx/**/tests/*}"
      run: just build-instructions
      stage_fixed: true
      priority: 25
    dprint:
      glob: "*.{md,python,ts,js,json,jsonc}"
      run: dprint fmt {staged_files}
      stage_fixed: true
      priority: 100
