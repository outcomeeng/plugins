name: Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    continue-on-error: false
    timeout-minutes: 30
    env:
      JUST_VERSION: "1.0.0"
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Run quality gate
        continue-on-error: false
        run: just check-full
      - name: Run L3 tests
        continue-on-error: false
        run: just test-l3
