name: Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Run quality gate
        run: just check-full
      - name: Run L3 tests
        env:
          SUBAGENT_DISCOVERY_AUTH_MODE: api
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: just test-l3
