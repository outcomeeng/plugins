name: Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SPX_COMMIT: "0123456789abcdef0123456789abcdef01234567"
    steps:
      - uses: actions/checkout@v5
      - name: Check out spx
        uses: actions/checkout@v5
        with:
          repository: outcomeeng/spx
          ref: ${{ env.SPX_COMMIT }}
          path: spx-source
      - name: Build spx
        run: |
          set -euo pipefail
          cd spx-source
          pnpm install --frozen-lockfile
          pnpm run build
          echo "$PWD/bin" >> "$GITHUB_PATH"
      - name: Run quality gate
        run: just check-full
