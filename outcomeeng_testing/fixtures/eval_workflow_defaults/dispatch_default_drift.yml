name: Violating eval workflow
on:
  workflow_dispatch:
    inputs:
      max_budget_usd:
        type: string
        default: "9.99"
      timeout_seconds:
        type: string
        default: "180"
jobs:
  evals:
    runs-on: ubuntu-latest
    env:
      MAX_BUDGET_USD: ${{ github.event.inputs.max_budget_usd || '0.75' }}
      TIMEOUT_SECONDS: ${{ github.event.inputs.timeout_seconds || '180' }}
    steps:
      - run: echo eval
