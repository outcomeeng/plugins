name: Violating native acceptance workflow
on:
  workflow_dispatch:
jobs:
  acceptance:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_ROOT: native-acceptance
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      SUBAGENT_DISCOVERY_AUTH_MODE: api
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - run: |
          export OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}"
          just verify-native-profile-execution "${ARTIFACT_ROOT}/profiles"
      - run: just verify-native-auditor-dispatch "${ARTIFACT_ROOT}/auditors"
      - uses: actions/upload-artifact@v7
        with:
          name: native-profile-acceptance
          path: ${{ env.ARTIFACT_ROOT }}
