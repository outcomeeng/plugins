<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spec Tree — live</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
    /* Vendored from the product design system (levenate-tree.html). Spike: inlined;
       ships as static assets in the interfaces plugin per 13-rendering.adr.md. */
    :root {
      --canvas: oklch(0.966 0.004 255);
      --paper: oklch(0.976 0.003 255);
      --surface: oklch(0.995 0.001 255);
      --sunken: oklch(0.945 0.005 255);
      --ink: oklch(0.215 0.011 255);
      --ink-2: oklch(0.420 0.012 255);
      --ink-3: oklch(0.505 0.013 255);
      --line: oklch(0.895 0.006 255);
      --accent: oklch(0.550 0.130 250);
      --accent-deep: oklch(0.450 0.130 250);
      --accent-wash: oklch(0.955 0.025 250);
      --accent-line: oklch(0.790 0.060 250);
      --on-accent: oklch(0.995 0.001 255);
      --st-passing: oklch(0.600 0.120 155);
      --st-passing-ink: oklch(0.470 0.130 152);
      --st-failing: oklch(0.585 0.165 30);
      --st-failing-ink: oklch(0.510 0.180 28);
      --st-specified: oklch(0.580 0.100 245);
      --st-specified-ink: oklch(0.490 0.110 248);
      --st-declared: oklch(0.655 0.020 255);
      --st-declared-ink: oklch(0.500 0.018 258);
      --st-unknown: oklch(0.820 0.010 255);
      --cat-outcome: oklch(0.560 0.110 80);
      --cat-outcome-w: oklch(0.950 0.045 85);
      --cat-adr: oklch(0.520 0.130 300);
      --cat-adr-w: oklch(0.950 0.040 300);
      --cat-pdr: oklch(0.500 0.090 195);
      --cat-pdr-w: oklch(0.950 0.035 195);
      --shadow-sm: 0 1px 2px oklch(0.5 0.02 255/0.08);
      --font-sans: "Schibsted Grotesk", system-ui, -apple-system, sans-serif;
      --font-display: "Newsreader", Georgia, serif;
      --font-mono: "JetBrains Mono", ui-monospace, monospace;
      --text-xs: 0.8125rem;
      --text-sm: 0.875rem;
      --text-2xl: 1.5rem;
      --radius-sm: 8px;
      --radius: 12px;
    }
    [data-theme="dark"] {
      --canvas: oklch(0.150 0.009 255);
      --paper: oklch(0.175 0.010 255);
      --surface: oklch(0.215 0.011 255);
      --sunken: oklch(0.115 0.008 255);
      --ink: oklch(0.976 0.003 255);
      --ink-2: oklch(0.895 0.006 255);
      --ink-3: oklch(0.840 0.007 255);
      --line: oklch(0.300 0.012 255);
      --accent: oklch(0.680 0.150 250);
      --accent-deep: oklch(0.700 0.100 250);
      --accent-wash: oklch(0.300 0.060 250);
      --accent-line: oklch(0.460 0.085 250);
      --on-accent: oklch(0.115 0.008 255);
      --st-passing: oklch(0.720 0.150 155);
      --st-passing-ink: oklch(0.720 0.150 155);
      --st-failing: oklch(0.700 0.180 30);
      --st-failing-ink: oklch(0.700 0.180 30);
      --st-specified: oklch(0.700 0.130 245);
      --st-specified-ink: oklch(0.700 0.130 245);
      --st-declared: oklch(0.640 0.020 255);
      --st-declared-ink: oklch(0.640 0.020 255);
      --st-unknown: oklch(0.420 0.010 255);
      --cat-outcome: oklch(0.560 0.110 80);
      --cat-outcome-w: oklch(0.300 0.055 80);
      --cat-adr: oklch(0.720 0.120 300);
      --cat-adr-w: oklch(0.300 0.060 300);
      --cat-pdr: oklch(0.700 0.100 195);
      --cat-pdr-w: oklch(0.300 0.050 195);
      --shadow-sm: 0 1px 2px oklch(0 0 0/0.4);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      height: 100%;
    }
    body {
      background: var(--canvas);
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: var(--text-sm);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    .topbar {
      display: flex;
      align-items: baseline;
      gap: 1.1rem;
      padding: 0.85rem 1.4rem;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 5;
    }
    .brand {
      font-family: var(--font-display);
      font-size: var(--text-2xl);
      font-weight: 600;
    }
    .brand-sub {
      color: var(--ink-3);
      font-size: var(--text-sm);
    }
    .legend {
      margin-left: auto;
      display: flex;
      gap: 0.85rem;
      align-items: center;
    }
    .lg {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: var(--text-sm);
      color: var(--ink-2);
    }
    .lg .dot {
      width: 0.65rem;
      height: 0.65rem;
      border-radius: 999px;
    }
    .lg b {
      font-variant-numeric: tabular-nums;
      color: var(--ink);
    }
    #status {
      font-size: var(--text-xs);
      color: var(--ink-3);
    }
    #status.live::before {
      content: "● ";
      color: var(--st-passing);
    }
    #status.off::before {
      content: "● ";
      color: var(--st-failing);
    }
    .theme-btn {
      font: inherit;
      font-size: var(--text-sm);
      cursor: pointer;
      color: var(--ink-2);
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 0.25rem 0.7rem;
      box-shadow: var(--shadow-sm);
    }
    .layout {
      display: grid;
      grid-template-columns: minmax(320px, 420px) 1fr;
      grid-template-rows: minmax(0, 1fr);
      height: calc(100% - 57px);
    }
    .tpane {
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }
    .qpane {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-right: 1px solid var(--line);
      background: var(--paper);
    }
    .qscroll {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 1.1rem 1.2rem;
    }
    .chat-input {
      display: flex;
      gap: 0.5rem;
      padding: 0.7rem 1rem;
      border-top: 1px solid var(--line);
      background: var(--surface);
    }
    .chat-input textarea {
      flex: 1;
      resize: none;
      font: inherit;
      font-size: var(--text-sm);
      padding: 0.45rem 0.6rem;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--paper);
      color: var(--ink);
    }
    .chat-input textarea:focus {
      outline: none;
      border-color: var(--accent);
    }
    .chat-input button {
      background: var(--accent);
      border: none;
      color: var(--on-accent);
      border-radius: var(--radius-sm);
      padding: 0 0.9rem;
      cursor: pointer;
      font: inherit;
      font-size: var(--text-sm);
      font-weight: 600;
    }
    .msg {
      margin: 0.4rem 0;
      padding: 0.5rem 0.7rem;
      border-radius: var(--radius-sm);
      max-width: 90%;
      font-size: var(--text-sm);
      line-height: 1.45;
      white-space: pre-wrap;
    }
    .msg.user {
      background: var(--accent-wash);
      border: 1px solid var(--accent-line);
      margin-left: auto;
    }
    .msg.assistant {
      background: var(--sunken);
      border: 1px solid var(--line);
    }
    .msg .who {
      font-size: var(--text-xs);
      color: var(--ink-3);
      margin-bottom: 0.15rem;
    }
    .tree {
      flex: 1;
      overflow: auto;
      background: var(--canvas);
      padding: 0.7rem 0;
    }
    .sec-h {
      font-size: var(--text-xs);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--ink-3);
      margin: 1.1rem 0 0.55rem;
    }
    .sec-h:first-child {
      margin-top: 0;
    }
    .q {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 0.8rem 0.9rem;
      margin-bottom: 0.6rem;
      box-shadow: var(--shadow-sm);
    }
    .q.current {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }
    .q.settled {
      opacity: 0.65;
    }
    .q .text {
      font-family: var(--font-display);
      font-size: 1.05rem;
      margin-bottom: 0.5rem;
    }
    .q .opt {
      display: inline-block;
      margin: 0.2rem 0.35rem 0.2rem 0;
      padding: 0.3rem 0.65rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--paper);
      color: var(--ink);
      cursor: pointer;
      font: inherit;
      font-size: var(--text-xs);
    }
    .q .opt:hover {
      border-color: var(--accent);
      color: var(--accent-deep);
    }
    .q .choice {
      color: var(--accent-deep);
      font-size: var(--text-sm);
      font-weight: 600;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.3rem 1rem 0.3rem 0;
      border-left: 3px solid transparent;
    }
    .row:hover {
      background: var(--sunken);
    }
    .node.sel > .row {
      background: var(--accent-wash);
      border-left-color: var(--accent);
    }
    .dot {
      width: 0.6rem;
      height: 0.6rem;
      border-radius: 999px;
      flex: none;
    }
    .row .act {
      background: none;
      border: none;
      color: var(--ink-3);
      cursor: pointer;
      font: inherit;
      font-size: var(--text-sm);
      padding: 0 0.25rem;
      opacity: 0;
      flex: none;
    }
    .row:hover .act {
      opacity: 1;
    }
    .row .act:hover {
      color: var(--accent-deep);
    }
    ul.tree-list, ul.tree-list ul {
      list-style: none;
    }
    li.node > ul {
      margin: 0;
    }
    li.node.drop-into > .row {
      outline: 1px dashed var(--accent);
      outline-offset: -1px;
    }
    li.node.drop-before > .row {
      box-shadow: inset 0 2px 0 0 var(--accent);
    }
    li.node.drop-after > .row {
      box-shadow: inset 0 -2px 0 0 var(--accent);
    }
    ul.tree-list.root-drop {
      outline: 1px dashed var(--accent);
      outline-offset: -4px;
    }
    .kind {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 1px 8px;
      border-radius: 999px;
      border: 1px solid transparent;
    }
    .kind.enabler {
      color: var(--ink-2);
      background: var(--sunken);
      border-color: var(--line);
    }
    .kind.outcome {
      color: var(--cat-outcome);
      background: var(--cat-outcome-w);
    }
    .kind.adr {
      color: var(--cat-adr);
      background: var(--cat-adr-w);
    }
    .kind.pdr {
      color: var(--cat-pdr);
      background: var(--cat-pdr-w);
    }
    .state-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      flex: 0 0 auto;
      background: var(--st-unknown);
      border: 1px solid oklch(0.5 0.02 255 / 0.25);
    }
    .state-dot.declared {
      background: var(--st-declared);
    }
    .state-dot.specified {
      background: var(--st-specified);
    }
    .state-dot.passing {
      background: var(--st-passing);
    }
    .state-dot.failing {
      background: var(--st-failing);
    }
    .idx {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--ink-3);
      flex: 0 0 auto;
    }
    .title {
      flex: 1;
      padding: 2px 4px;
      border-radius: 4px;
    }
    .title:focus {
      outline: 1px solid var(--accent);
      background: var(--surface);
    }
    .row button {
      background: none;
      border: none;
      color: var(--ink-3);
      cursor: pointer;
      font-size: 13px;
      padding: 2px 5px;
    }
    .row button:hover {
      color: var(--accent-deep);
    }
    .toolbar {
      padding: 0.7rem 1rem;
    }
    .toolbar button {
      background: var(--accent-wash);
      border: 1px solid var(--accent);
      color: var(--accent-deep);
      border-radius: var(--radius-sm);
      padding: 0.35rem 0.8rem;
      cursor: pointer;
      font: inherit;
      font-size: var(--text-xs);
      margin-right: 0.4rem;
    }
    </style>
  </head>
  <body>
    <div class="topbar">
      <span class="brand">Spec Tree</span>
      <span class="brand-sub" id="sub">live</span>
      <div class="legend" id="legend"></div>
      <span id="rev" class="brand-sub"></span>
      <span id="status" class="off">connecting…</span>
      <button class="theme-btn" id="theme">dark</button>
    </div>
    <div class="layout">
      <div class="qpane">
        <div class="qscroll">
          <div class="sec-h">Chat</div>
          <div id="chat"></div>
          <div class="sec-h">Current</div>
          <div id="current"></div>
          <div class="sec-h">Planned</div>
          <div id="planned"></div>
          <div class="sec-h">Settled</div>
          <div id="settled"></div>
        </div>
        <div class="chat-input">
          <textarea id="chat-text" placeholder="Message the agent…  (Enter to send · Shift+Enter for newline)" rows="2"></textarea>
          <button id="chat-send">Send</button>
        </div>
      </div>
      <div class="tpane">
        <ul class="tree tree-list" id="tree"></ul>
        <div class="toolbar">
          <button onclick="addNode(null, 'enabler')">+ root enabler</button>
          <button onclick="addNode(null, 'outcome')">+ root outcome</button>
        </div>
      </div>
    </div>

    <script>
    const TOKEN = new URLSearchParams(location.search).get("token") || "";
    let rev = -1;
    let state = {
      questions: { planned: [], current: null, settled: [] },
      tree: [],
      chat: [],
    };
    let dragId = null;

    const CACHE_KEY = "live-interview-cache";
    function loadCache() {
      try {
        const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
        if (cached && cached.rev > rev) {
          rev = cached.rev;
          state = cached.state;
        }
      } catch (_) {}
    }

    function persist() {
      try {
        localStorage.setItem(CACHE_KEY, JSON.stringify({ rev, state }));
      } catch (_) {}
    }

    // --- Sending interactions -------------------------------------------------

    async function send(event) {
      event.baseRev = rev;
      const res = await fetch(`/event?token=${TOKEN}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(event),
      });
      const data = await res.json();
      if (data.ok) rev = data.rev;
      // SSE delivers the authoritative state
      else await refetch(); // conflict: resync from the server
    }

    async function refetch() {
      const res = await fetch(`/state?token=${TOKEN}`);
      const data = await res.json();
      rev = data.rev;
      state = data.state;
      render();
      persist();
    }

    function answer(qid, choice) {
      send({ type: "answer", questionId: qid, choice });
    }
    function renameNode(id, title) {
      send({ type: "tree_rename", nodeId: id, title });
    }
    function removeNode(id) {
      send({ type: "tree_remove", nodeId: id });
    }
    function addNode(parentId, kind) {
      send({ type: "tree_add", parentId, kind, title: "New " + kind });
    }
    function moveNode(id, newParentId, newIndex) {
      send({ type: "tree_move", nodeId: id, newParentId, newIndex });
    }

    // --- Rendering ------------------------------------------------------------

    function qCard(q, cls) {
      const div = document.createElement("div");
      div.className = "q " + cls;
      const text = document.createElement("div");
      text.className = "text";
      text.textContent = q.text;
      div.appendChild(text);
      if (q.choice != null) {
        const c = document.createElement("div");
        c.className = "choice";
        c.textContent = "→ " + q.choice;
        div.appendChild(c);
      } else {
        (q.options || []).forEach((opt) => {
          const b = document.createElement("button");
          b.className = "opt";
          b.textContent = opt;
          b.onclick = () => answer(q.id, opt);
          div.appendChild(b);
        });
      }
      return div;
    }

    // Find a node's parent id and index among its siblings (null parent = root).
    function locate(id, nodes, parentId) {
      nodes = nodes || state.tree;
      parentId = parentId === undefined ? null : parentId;
      for (let i = 0; i < nodes.length; i++) {
        if (nodes[i].id === id) return { parentId, index: i };
        const hit = locate(id, nodes[i].children || [], nodes[i].id);
        if (hit) return hit;
      }
      return null;
    }

    // Translate a drop zone (before/into/after a target) into a move event.
    function dropRelative(dragId, targetId, zone) {
      if (zone === "into") {
        moveNode(dragId, targetId, 0);
        return;
      }
      const t = locate(targetId);
      const d = locate(dragId);
      if (!t) return;
      let idx = t.index + (zone === "after" ? 1 : 0);
      // Removing the dragged node first shifts later indices in the same list.
      if (d && d.parentId === t.parentId && d.index < idx) idx -= 1;
      moveNode(dragId, t.parentId, idx);
    }

    const STATES = ["declared", "specified", "failing", "passing"];

    function nodeLi(node, depth) {
      const li = document.createElement("li");
      li.className = "node";
      li.draggable = true;
      li.dataset.id = node.id;

      const row = document.createElement("div");
      row.className = "row";
      row.style.paddingLeft = (1 + depth * 1.15) + "rem";

      // Derived state (declared/specified/passing/failing) from the SPX
      // projection; nodes created in-session carry none and render neutral.
      const dot = document.createElement("span");
      const st = STATES.includes(node.state) ? node.state : "";
      dot.className = "state-dot" + (st ? " " + st : "");
      dot.title = st || "no state";
      row.appendChild(dot);

      const kind = document.createElement("span");
      kind.className = "kind " + node.kind;
      kind.textContent = node.kind;
      row.appendChild(kind);

      if (node.order != null) {
        const idx = document.createElement("span");
        idx.className = "idx";
        idx.textContent = node.order;
        row.appendChild(idx);
      }

      const title = document.createElement("span");
      title.className = "title";
      title.contentEditable = "true";
      title.textContent = node.title;
      title.onblur = () => {
        if (title.textContent !== node.title) renameNode(node.id, title.textContent);
      };
      title.onkeydown = (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          title.blur();
        }
      };
      row.appendChild(title);

      const addBtn = document.createElement("button");
      addBtn.className = "act";
      addBtn.textContent = "+";
      addBtn.title = "add child enabler";
      addBtn.onclick = () => addNode(node.id, "enabler");
      row.appendChild(addBtn);

      const del = document.createElement("button");
      del.className = "act";
      del.textContent = "✕";
      del.title = "remove";
      del.onclick = () => removeNode(node.id);
      row.appendChild(del);

      li.appendChild(row);

      const clearZones = () => li.classList.remove("drop-before", "drop-into", "drop-after");

      li.ondragstart = (e) => {
        dragId = node.id;
        e.stopPropagation();
      };
      li.ondragover = (e) => {
        e.preventDefault();
        e.stopPropagation();
        // Top third inserts before as a sibling, bottom third after, middle nests.
        const r = row.getBoundingClientRect();
        const y = e.clientY - r.top;
        const zone = y < r.height * 0.3
          ? "before"
          : y > r.height * 0.7
          ? "after"
          : "into";
        li.dataset.zone = zone;
        clearZones();
        li.classList.add("drop-" + zone);
      };
      li.ondragleave = clearZones;
      li.ondrop = (e) => {
        e.preventDefault();
        e.stopPropagation();
        const zone = li.dataset.zone || "into";
        clearZones();
        if (dragId && dragId !== node.id) dropRelative(dragId, node.id, zone);
        dragId = null;
      };

      if (node.children && node.children.length) {
        const ul = document.createElement("ul");
        node.children.forEach((c) => ul.appendChild(nodeLi(c, depth + 1)));
        li.appendChild(ul);
      }
      return li;
    }

    function countStates(nodes, acc) {
      (nodes || []).forEach((n) => {
        if (STATES.includes(n.state)) acc[n.state] = (acc[n.state] || 0) + 1;
        countStates(n.children, acc);
      });
      return acc;
    }

    function renderLegend() {
      const counts = countStates(state.tree, {});
      const legend = document.getElementById("legend");
      legend.innerHTML = "";
      STATES.forEach((st) => {
        const span = document.createElement("span");
        span.className = "lg";
        span.innerHTML = `<span class="dot" style="background:var(--st-${st})"></span>${st} <b>${counts[st] || 0}</b>`;
        legend.appendChild(span);
      });
      document.getElementById("sub").textContent = (state.tree || []).length + " top-level nodes · state derived from tests";
    }

    function render() {
      document.getElementById("rev").textContent = "rev " + rev;
      const q = state.questions;
      const cur = document.getElementById("current");
      cur.innerHTML = "";
      if (q.current) cur.appendChild(qCard(q.current, "current"));
      const pl = document.getElementById("planned");
      pl.innerHTML = "";
      (q.planned || []).forEach((x) => pl.appendChild(qCard(x, "planned")));
      const se = document.getElementById("settled");
      se.innerHTML = "";
      (q.settled || []).forEach((x) => se.appendChild(qCard(x, "settled")));

      const tree = document.getElementById("tree");
      tree.innerHTML = "";
      (state.tree || []).forEach((n) => tree.appendChild(nodeLi(n, 0)));
      renderLegend();
      renderChat();
    }

    function renderChat() {
      const box = document.getElementById("chat");
      if (!box) return;
      box.innerHTML = "";
      (state.chat || []).forEach((m) => {
        const div = document.createElement("div");
        div.className = "msg " + (m.role === "assistant" ? "assistant" : "user");
        const who = document.createElement("div");
        who.className = "who";
        who.textContent = m.role === "assistant" ? "agent" : "you";
        const txt = document.createElement("div");
        txt.textContent = m.text;
        div.appendChild(who);
        div.appendChild(txt);
        box.appendChild(div);
      });
    }

    function sendChat() {
      const ta = document.getElementById("chat-text");
      const text = ta.value.trim();
      if (!text) return;
      send({ type: "chat", role: "user", text });
      ta.value = "";
    }

    // --- SSE: agent-side updates push here ------------------------------------

    function connect() {
      const es = new EventSource(`/events?token=${TOKEN}&since=${rev}`);
      const status = document.getElementById("status");
      es.onopen = () => {
        status.className = "live";
        status.textContent = "live";
      };
      es.onerror = () => {
        status.className = "off";
        status.textContent = "reconnecting…";
      };
      es.onmessage = (e) => {
        const data = JSON.parse(e.data);
        if (data.rev > rev) {
          rev = data.rev;
          state = data.state;
          render();
          persist();
        }
      };
    }

    // Dropping on the root list's empty area appends at the end of the roots.
    function setupRootDrop() {
      const tree = document.getElementById("tree");
      tree.addEventListener("dragover", (e) => {
        if (e.target === tree) {
          e.preventDefault();
          tree.classList.add("root-drop");
        }
      });
      tree.addEventListener("dragleave", (e) => {
        if (e.target === tree) tree.classList.remove("root-drop");
      });
      tree.addEventListener("drop", (e) => {
        if (e.target !== tree) return; // a node li handled it (stopPropagation)
        e.preventDefault();
        tree.classList.remove("root-drop");
        if (dragId) {
          moveNode(dragId, null, (state.tree || []).length);
          dragId = null;
        }
      });
    }

    function setupTheme() {
      const btn = document.getElementById("theme");
      const root = document.documentElement;
      btn.onclick = () => {
        const dark = root.getAttribute("data-theme") === "dark";
        root.setAttribute("data-theme", dark ? "light" : "dark");
        btn.textContent = dark ? "dark" : "light";
      };
    }

    function setupChat() {
      document.getElementById("chat-send").onclick = sendChat;
      document.getElementById("chat-text").addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendChat();
        }
      });
    }

    async function boot() {
      loadCache(); // optimistic paint from last session
      render();
      await refetch(); // authoritative state from the server
      setupRootDrop();
      setupTheme();
      setupChat();
      connect(); // then stream agent-side updates
    }

    boot();
    </script>
  </body>
</html>
