[project]
name = "outcomeeng-plugins"
version = "0.1.0"
description = "Outcome Engineering plugin marketplace for Codex and Claude Code"
requires-python = ">=3.14"
dependencies = ["click>=8.0", "jinja2>=3.1"]

[project.scripts]
outcomeeng-evals = "outcomeeng_evals.cli:main"

[dependency-groups]
dev = [
  "hypothesis>=6.0",
  "mypy>=1.20",
  "pyright>=1.1.410",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pyyaml>=6.0",
  "ruff>=0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["outcomeeng", "outcomeeng_testing", "outcomeeng_evals"]

[tool.uv]
python-preference = "only-managed"

[tool.pytest.ini_options]
testpaths = ["spx", "tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --import-mode=importlib"
pythonpath = ["."]

[tool.ruff]
# ruff owns Python formatting (`ruff format`) and linting (`ruff check`) for this
# repo; dprint does not touch `.py`. outcomeeng/vendor/ holds vendored third-party
# code kept as upstream ships it, so exclude it from both — mirrors the
# [tool.mypy] exclude below and dprint's `outcomeeng/vendor/**` exclude.
extend-exclude = ["outcomeeng/vendor/"]
# Pin the formatter/linter below Python 3.14 so ruff applies no 3.14-only
# restyling — notably PEP 758, which strips the parentheses from `except (A, B):`
# (ruff otherwise infers 3.14 from `requires-python` and rewrites them). py313 is
# the highest target that avoids PEP 758 while still accepting the 3.12+ syntax
# this toolchain already uses (PEP 695 `type` aliases); a lower target such as
# py311 would reject those pre-existing aliases.
target-version = "py313"

[tool.mypy]
# outcomeeng/vendor/ holds vendored third-party code (e.g. Anthropic's
# skill validator under outcomeeng/vendor/anthropics_skills/) that is not
# written to this repo's strict typing standards — exclude it from the
# type check and ignore type errors for the package.
exclude = ["outcomeeng/vendor/"]

[[tool.mypy.overrides]]
module = "outcomeeng.vendor.*"
ignore_errors = true

[tool.pyright]
