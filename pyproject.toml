[project]
name = "outcomeeng-plugins"
version = "0.1.0"
description = "Outcome Engineering plugin marketplace for Codex and Claude Code"
requires-python = ">=3.14"
dependencies = ["click>=8.0", "jinja2>=3.1"]

[project.scripts]
outcomeeng-evals = "outcomeeng_evals.cli:main"

[dependency-groups]
dev = [
  "hypothesis>=6.0",
  "mypy>=1.20",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pyyaml>=6.0",
  "ruff>=0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["outcomeeng", "outcomeeng_testing", "outcomeeng_evals"]

[tool.uv]
python-preference = "only-managed"

[tool.pytest.ini_options]
testpaths = ["spx", "tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --import-mode=importlib"
pythonpath = ["."]

[tool.mypy]
# outcomeeng/vendor/ holds vendored third-party code (e.g. Anthropic's
# skill validator under outcomeeng/vendor/anthropics_skills/) that is not
# written to this repo's strict typing standards — exclude it from the
# type check and ignore type errors for the package.
exclude = ["outcomeeng/vendor/"]

[[tool.mypy.overrides]]
module = "outcomeeng.vendor.*"
ignore_errors = true

[tool.pyright]
