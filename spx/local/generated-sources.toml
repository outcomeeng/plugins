# Generated-source declaration: every committed generated extent and its
# producing relation, governed by
# spx/31-outcomeeng.enabler/31-verification.enabler/15-generated-attribution.pdr.md.
# A `begin`/`end` marker matches at the start of a line — leading whitespace
# only where the generator emits the marker indented (eval-trigger paths),
# trailing content only where the begin or end is a prefix of a version- or
# name-bearing marker line (router and shared fences). A marker quoted in
# prose or an example fence bounds nothing, and a relation's generator fence
# matching is authoritative where stricter. The eval-trigger and README
# plugin-catalog generators do not themselves enforce line-start anchoring;
# the declared line-start rule governs attribution for those relations, with
# each generator's anchor gap tracked at its owning node. Extents span begin
# through end inclusive, for every such pair in the file.

[[relation]]
outputs = ["dist/claude/**", "dist/codex/**"]
sources = [
  "src/plugins/**",
  "src/_shared/**",
  "src/templates/**",
  "dprint.jsonc",
  "outcomeeng/validation/spx_version.py",
]
generator = ["outcomeeng/distribution/**"]
regenerate = "just build-skills"

[[relation]]
outputs = [
  { file = "CLAUDE.md", begin = "<!-- SPEC-TREE v", end = "<!-- /SPEC-TREE -->" },
  { file = "AGENTS.md", begin = "<!-- SPEC-TREE v", end = "<!-- /SPEC-TREE -->" },
]
sources = [
  "dist/claude/spec-tree/skills/update-instruction-block/templates/instruction-block.md",
  "dist/codex/spec-tree/skills/update-instruction-block/templates/instruction-block.md",
  "spx/**/tests/*",
]
generator = [
  "outcomeeng/distribution/instruction_block.py",
  "src/plugins/spec-tree/skills/update-instruction-block/scripts/instruction_block.py",
]
regenerate = "just build-instructions"

# Shared root-instruction regions are authored in whichever root file was
# edited most recently and mirrored whole into the other; the mirrored copy
# is the managed extent. Both files are sources, so a shared-region edit
# always touches a source and stays judged as evidence.
[[relation]]
outputs = [
  { file = "CLAUDE.md", begin = "<!-- SPEC-TREE:shared", end = "<!-- /SPEC-TREE:shared" },
  { file = "AGENTS.md", begin = "<!-- SPEC-TREE:shared", end = "<!-- /SPEC-TREE:shared" },
]
sources = ["CLAUDE.md", "AGENTS.md"]
generator = [
  "outcomeeng/distribution/instruction_block.py",
  "src/plugins/spec-tree/skills/update-instruction-block/scripts/instruction_block.py",
]
regenerate = "just build-instructions"

[[relation]]
outputs = [
  { file = "README.md", begin = "<!-- BEGIN PLUGIN CATALOG (generated by `just docs` — do not edit) -->", end = "<!-- END PLUGIN CATALOG -->" },
]
sources = [
  ".claude-plugin/marketplace.json",
  "src/plugins/*/skills/*/SKILL.md",
  "src/plugins/*/agents/*.md",
]
generator = ["outcomeeng/catalog/plugin_catalog.py"]
regenerate = "just docs"

[[relation]]
outputs = [
  { file = ".github/workflows/spec-tree-evals.yml", begin = "# BEGIN eval-trigger-paths", end = "# END eval-trigger-paths" },
]
sources = ["spx/**/evals/**/eval.toml"]
generator = ["outcomeeng_evals/**"]
regenerate = "just build-eval-triggers"

# Producer-coupled eval prompts. Each eval's `eval.toml` `[prompt_source]`
# declares its template and producer file(s); the producer set spans authored
# skill sources under src/plugins/ and generated runtime copies under dist/
# (a relation's source may itself be another relation's output). The gate's
# `eval-prompts` step runs the regenerate command's `--check` form.
[[relation]]
outputs = ["spx/**/evals/**/prompt.md"]
sources = [
  "spx/**/evals/**/prompt.template.md",
  "spx/**/evals/**/eval.toml",
  "src/plugins/**",
  "dist/claude/**",
  "dist/codex/**",
]
generator = ["outcomeeng_evals/**"]
regenerate = "just eval-materialize-prompts spx"
