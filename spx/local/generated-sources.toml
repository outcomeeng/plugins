# Shared root-instruction regions are authored in whichever root file was
# edited most recently and mirrored whole into the other; the mirrored copy
# is the managed extent. Both files are sources, so a shared-region edit
# always touches a source and stays judged as evidence.
[[relation]]
outputs = [
  { file = "CLAUDE.md", begin = "<!-- SPEC-TREE:shared", end = "<!-- /SPEC-TREE:shared" },
  { file = "AGENTS.md", begin = "<!-- SPEC-TREE:shared", end = "<!-- /SPEC-TREE:shared" },
]
sources = ["CLAUDE.md", "AGENTS.md"]
generator = [
  "outcomeeng/distribution/instruction_block.py",
  "src/plugins/spec-tree/skills/update-instruction-block/scripts/instruction_block.py",
]
regenerate = "just build-instructions"

[[relation]]
