# spx/31-outcomeeng.enabler/31-verification.enabler/15-generated-attribution.pdr.md.
# A `begin`/`end` marker matches a line whose content, after leading
# whitespace, starts with the marker text; the extent spans begin through end
# inclusive, for every such pair in the file.

