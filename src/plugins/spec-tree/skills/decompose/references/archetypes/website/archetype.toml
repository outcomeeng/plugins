schema_version = 1
slug = "website"
title = "Content / marketing website"
summary = "A public website that converts and engages many anonymous visitors, with bets on measurable visitor behavior over a rendering + measurement substrate."

source_product = "xiperlabs.com"
source_repo = "xiperinc/xiperlabs.com"

[recognition]
# Mechanical signals the router reads from a new product's product.md.
user_plurality = "many-anonymous" # public visitors, not a few known users
behavior_measurability = "measurable" # conversion / traffic / adoption observable in analytics
primary_surface = ["web"]
decomposition_driver = "content-pages-and-conversion-bets"
governance_weight = "medium"
deployment_model = "static-hosted"

[outcome_topology]
has_outcomes = true
reason = "Many anonymous visitors whose behavior change (convert, return, adopt, apply) is measurable via the analytics substrate. The bets are outcomes; the rendering machinery is the enabler substrate beneath them."
# Structural correlate: an outcome-bearing website carries a measurement substrate
# (analytics-platform) that the outcome bets read from. No measurement substrate => reconsider
# whether the product actually has measurable bets.
measurement_substrate = "analytics-platform"

[index_convention]
# Per-directory bands. At every level enablers (substrate) sort below outcomes (bets).
decisions = "15-20"
enablers = "21-50"
outcomes = "51-79"
max = 79

[concerns]
# Concerns every website seeds (core) plus signal-gated ones (optional). Uniform `core`/`optional`
# key space across all archetypes; the enabler/outcome kind of each concern lives in seed-tree.json,
# so this list is kind-agnostic. conversion + discovery are the near-universal bets.
core = [
  "infrastructure",
  "environment",
  "design-system",
  "analytics-platform",
  "site",
  "page",
  "conversion",
  "discovery",
]
optional = ["adoption", "branding"]

[concerns.gates]
adoption = "the site drives evaluation/adoption of a product through docs, showcases, or examples"
branding = "the site carries brand / company / careers content to build credibility or attract talent"
